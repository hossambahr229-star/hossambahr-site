name: Service Section Navigation Acceptance
on:
  push:
    branches: [agent/service-section-navigation]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm run build
      - run: node --test test/architecture/service-section-navigation.test.mjs
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/service-section-navigation-browser.mjs
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/service-fact-summary-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-section-navigation-preview
          path: |
            diagnostics/service-section-navigation-preview
            diagnostics/service-fact-summary-preview
      - name: Retain review evidence
        if: always()
        run: |
          git config user.name "HossamBahr Preview Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          if [ ! -d diagnostics/service-section-navigation-preview ]; then exit 0; fi
          git add diagnostics/service-section-navigation-preview
          if ! git diff --cached --quiet; then
            git commit -m "Record service section navigation evidence [skip ci]"
            git pull --rebase --autostash origin agent/service-section-navigation
            git push origin HEAD:agent/service-section-navigation
          fi
