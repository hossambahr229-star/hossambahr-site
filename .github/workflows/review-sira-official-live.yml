name: Review SIRA Official Cards and Typecheck
on:
  push:
    branches: [agent/review-sira-official-live]
    paths:
      - scripts/review-sira-official-live.mjs
      - .github/workflows/review-sira-official-live.yml
      - src/publication/generate-transaction-discovery.mjs
      - transaction-discovery.css
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Check changed Edge function
        run: deno check supabase/functions/public-ai-concierge/index.ts
      - uses: browser-actions/setup-chrome@v1
      - name: Install capture runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0 sharp@0.35.4
      - name: Capture actual published AI panel and reference overlays
        run: HB_BASE_URL=https://hossambahr.com/ HB_BROWSER_PATH="$(which chrome)" node scripts/review-sira-official-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-sira-official-live
          path: artifacts/review-sira-official-live
      - name: Preserve only new visual evidence on the diagnosis branch
        if: github.ref == 'refs/heads/agent/review-sira-official-live'
        run: |
          git config user.name "HossamBahr Visual Diagnosis"
          git config user.email "visual-diagnosis@users.noreply.github.com"
          git add artifacts/review-sira-official-live
          if ! git diff --cached --quiet; then
            git commit -m "Record regional live Production visual evidence [skip ci]"
            git push origin HEAD:agent/review-sira-official-live
          fi
