name: Concrete Business Idea Journeys
on:
  push:
    branches: [agent/concrete-business-idea-routing]
    paths: ['transaction-discovery.js','scripts/novice-business*','.github/workflows/novice-business-journeys.yml']
permissions:
  contents: read
jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npm run build
      - run: node --test scripts/novice-business-routing.test.mjs
      - run: node scripts/novice-business-browser.mjs
        env: {HB_BROWSER_PATH: /usr/bin/google-chrome, HB_OUTPUT_DIR: artifacts/novice-business}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novice-business-journeys
          path: artifacts/novice-business
