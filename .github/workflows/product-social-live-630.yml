name: Live public product sharing cards 630
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/product-social-live-630.yml, diagnostics/product-social-live-630.mjs]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node diagnostics/product-social-live-630.mjs
      - name: Preserve production checks
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/product-social-live-630/report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record live product sharing card checks"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
