name: Live official source panel contrast
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/live-official-source-contrast.mjs','.github/workflows/live-official-source-contrast.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: |
          for lang in en; do
            for width in 390 1440; do
              HB_LANG=$lang HB_WIDTH=$width HB_BROWSER_PATH="$(which chrome)" HB_OUTPUT_DIR=diagnostics/official-source-contrast-production-2026-10-22/$lang-$width node scripts/live-official-source-contrast.mjs
            done
          done
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/official-source-contrast-production-2026-10-22
          git diff --cached --quiet || git commit -m "Record live official source panel contrast [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: official-source-contrast-production, path: diagnostics/official-source-contrast-production-2026-10-22}
