name: Accept duration-scoped ICP job visa facts on Production 640
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/icp-job-variants-live-640.yml, diagnostics/icp-job-variants-live-640.mjs]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps firefox
      - env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node diagnostics/icp-job-variants-live-640.mjs
      - name: Preserve source-scoped live outcomes
        if: always()
        run: |
          test -f diagnostics/icp-job-variants-live-640/report.json || exit 0
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/icp-job-variants-live-640
          git commit -m "Record duration-specific facts without false completeness"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
