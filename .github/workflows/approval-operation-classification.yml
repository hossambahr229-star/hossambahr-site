name: Approval operation classification
on:
  push:
    branches: [agent/approval-operation-classification]
  pull_request:
    paths: [service-capabilities.js, business-domains.js, scripts/approval-operation-regression.test.mjs]
permissions:
  contents: read
jobs:
  classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/approval-operation-regression.test.mjs
      - run: npm run build
      - run: node src/publication/generate-transaction-discovery.mjs
      - run: node --test scripts/approval-operation-regression.test.mjs scripts/capability-discovery-regression.test.mjs scripts/capability-generator-integration.test.mjs
