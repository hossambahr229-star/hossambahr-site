name: Verify SEO indexing release and preview causal directory stability fix
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/rak-route-followup-20261117.yml]
permissions: {contents: write}
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env: {RELEASE_SHA: d09c6cc73ff96d512a361eb1ef2ff1966dd6b25f, PREVIEW_SHA: aca2d030eaaa512e45fad7c1ac80b5328172e968}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: d09c6cc73ff96d512a361eb1ef2ff1966dd6b25f, path: release}
      - uses: actions/checkout@v4
        with: {ref: 2a38792b3e6ab362821f193b98a36425fd9e2ceb, path: before}
      - uses: actions/checkout@v4
        with: {ref: aca2d030eaaa512e45fad7c1ac80b5328172e968, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npm --prefix site run build
      - run: HB_BROWSER_PATH="${{ steps.chrome.outputs.chrome-path }}" node diagnostics/directory-first-paint-preview-652.mjs
      - run: node diagnostics/seo651-live.mjs
        if: always()
      - name: Preserve source-preview and actual Production evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/seo651-live diagnostics/directory-first-paint-preview-652
          git diff --cached --quiet && exit 0
          git commit -m "Record actual indexing release acceptance and causal layout repair preview"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
