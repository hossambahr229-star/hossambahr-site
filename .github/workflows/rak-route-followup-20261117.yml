name: Inspect canonical service search presentation before SEO changes
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/rak-route-followup-20261117.yml]
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env: {SOURCE_SHA: 88753fc1f8e0e9e1aa613afd24306e54986a1d2e}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: 88753fc1f8e0e9e1aa613afd24306e54986a1d2e, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node diagnostics/seo-service-inventory-20261119.mjs
      - name: Preserve source search presentation inventory
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/seo-service-inventory-20261119
          git diff --cached --quiet && exit 0
          git commit -m "Record all service search titles descriptions and jurisdictions before SEO changes"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
