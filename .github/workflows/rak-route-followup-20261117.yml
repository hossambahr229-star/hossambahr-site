name: Verify actual homepage assistant government navigation after 646
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/rak-route-followup-20261117.yml]
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env: {SOURCE_SHA: 181222534f416f1ed52cbdfcd3001f896777bbc6}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: 181222534f416f1ed52cbdfcd3001f896777bbc6, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: cd site && npm run build
      - run: HB_BROWSER_PATH="${{ steps.chrome.outputs.chrome-path }}" node diagnostics/home-ai-navigation-live-646.mjs
      - name: Preserve actual Production journey evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/home-ai-navigation-live-646
          git diff --cached --quiet && exit 0
          git commit -m "Record real homepage assistant government navigation after 646"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
