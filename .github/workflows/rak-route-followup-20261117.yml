name: Preview all mandated no-search transaction journeys
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/rak-route-followup-20261117.yml]
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {SOURCE_SHA: d7d15c8e1736599e3264329fc387816e809c6794}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: d7d15c8e1736599e3264329fc387816e809c6794, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0 cheerio@1.1.2 sharp@0.35.4
      - run: npm run build
        working-directory: site
      - run: HB_BROWSER_PATH="${{ steps.chrome.outputs.chrome-path }}" node diagnostics/final-ux656.mjs
      - name: Preserve beginner journey preview
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/final-ux656-preview
          git diff --cached --quiet && exit 0
          git commit -m "Record all mandated transaction journey preview and screenshots"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
