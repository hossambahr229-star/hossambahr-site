name: Trace actual mobile directory layout shift and finish activity HTTP comparison
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/rak-route-followup-20261117.yml]
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env: {SOURCE_ASSET_SHA: 2a38792b3e6ab362821f193b98a36425fd9e2ceb}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: 2a38792b3e6ab362821f193b98a36425fd9e2ceb, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: HB_BROWSER_PATH="${{ steps.chrome.outputs.chrome-path }}" node diagnostics/seo-layout-trace-20261122.mjs
      - name: Preserve causal mobile and corrected activity evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/seo-layout-trace-20261122
          git diff --cached --quiet && exit 0
          git commit -m "Record corrected actual ICP search-presentation DOM acceptance"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
