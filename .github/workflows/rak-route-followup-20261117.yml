name: Verify exact live homepage release dates without unrelated changes
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/rak-route-followup-20261117.yml]
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env: {SOURCE_SHA: b7d1cd35370ff07dbc65b8c9266052f9ce1a90ea}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: b7d1cd35370ff07dbc65b8c9266052f9ce1a90ea, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node diagnostics/live-sitemap657.mjs
      - name: Preserve scoped live sitemap acceptance
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/home-lastmod657-live
          git diff --cached --quiet && exit 0
          git commit -m "Record two real homepage lastmod dates and unchanged sitemap scope"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
