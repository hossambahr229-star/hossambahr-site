name: Audit current whole-site SEO and mobile directory weight
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/rak-route-followup-20261117.yml]
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env: {SOURCE_SHA: 2a38792b3e6ab362821f193b98a36425fd9e2ceb}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: 2a38792b3e6ab362821f193b98a36425fd9e2ceb, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock cheerio@1.1.2 playwright@1.55.0
      - run: HB_BROWSER_PATH="${{ steps.chrome.outputs.chrome-path }}" node diagnostics/seo-transform-baseline-20261122.mjs
      - name: Preserve complete audit evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/seo-transform-baseline-20261122
          git diff --cached --quiet && exit 0
          git commit -m "Record current whole-site SEO and throttled mobile directory baseline"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
