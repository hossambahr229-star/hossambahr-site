name: Verify current provider status and partial official sources
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/rak-route-followup-20261117.yml]
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env: {SOURCE_SHA: 48b91ba3a7a78f7712e56be37e780abb5585ee4a}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: 48b91ba3a7a78f7712e56be37e780abb5585ee4a, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0 cheerio@1.1.2
      - run: HB_UX_OUTPUT=diagnostics/final-dependencies-20261123 node diagnostics/provider-state656.mjs
      - run: HB_BROWSER_PATH="${{ steps.chrome.outputs.chrome-path }}" node diagnostics/official-detail-probe656.mjs
      - name: Preserve actual authority and search acceptance
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/final-dependencies-20261123
          git diff --cached --quiet && exit 0
          git commit -m "Record sanitized current provider and official source review"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
