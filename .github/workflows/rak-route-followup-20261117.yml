name: Verify actual directory stability, search and activity SEO journeys
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/rak-route-followup-20261117.yml]
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env: {SOURCE_SHA: 689532f96014d8e291a360542dc81179524b2fc2}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: 689532f96014d8e291a360542dc81179524b2fc2, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: HB_BROWSER_PATH="${{ steps.chrome.outputs.chrome-path }}" node diagnostics/seo652-live.mjs
      - name: Preserve actual Production evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/seo652-live
          git diff --cached --quiet && exit 0
          git commit -m "Record actual directory CLS, real search and activity queries with public competitor mobile observations"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
