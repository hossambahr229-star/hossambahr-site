name: Production browser verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
      - name: Wait for the exact release marker
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat ux-release-marker.txt)"
          for attempt in {1..30}; do
            actual="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://hossambahr.com/ux-release-marker.txt?attempt=$attempt" || true)"
            if [ "$actual" = "$expected" ]; then exit 0; fi
            sleep 10
          done
          echo "Production never exposed expected marker: $expected" >&2
          exit 1
      - name: Scan every production HTML route for encoding corruption
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import re, sys

          root = Path('.')
          routes = []
          for path in root.rglob('*.html'):
              if any(part in {'.git', 'node_modules', 'zero-defect-smoke'} for part in path.parts):
                  continue
              rel = path.as_posix()
              route = '/' if rel == 'index.html' else '/' + rel[:-10] if rel.endswith('/index.html') else '/' + rel
              routes.append(route)
          if len(routes) != 322:
              raise SystemExit(f'Expected 322 tracked production routes, found {len(routes)}')
          bad = re.compile(r'\ufffd|[ØÙ][\u0080-\u00ffŒœŠšŸŽž–-™]|(?:Ã[\u0080-\u00ff]|Â[\u0080-\u00ff]|â€|ðŸ)')
          failures = []
          for route in sorted(routes):
              url = 'https://hossambahr.com' + quote(route, safe='/%?=&')
              try:
                  req = Request(url + ('&' if '?' in url else '?') + 'utf8-audit=1', headers={'Cache-Control':'no-cache','User-Agent':'HossamBahr-Production-Audit/1.0'})
                  raw = urlopen(req, timeout=25).read()
                  text = raw.decode('utf-8', errors='strict')
                  match = bad.search(text)
                  if match: failures.append((route, 'mojibake', match.group(0)))
              except Exception as exc:
                  failures.append((route, 'fetch/decode', str(exc)))
          print({'productionRoutes':len(routes), 'corrupted':len(failures), 'failures':failures[:20]})
          if failures: sys.exit(1)
      - name: Browser-render representative production journeys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-browser
          urls=(
            "/"
            "/services/"
            "/dubai-business-activities.html"
            "/command-center/"
            "/categories/companies-establishments/"
            "/categories/residency-visas/"
            "/categories/work-employees/"
            "/categories/property-rentals/"
            "/services/mohre-private-tutor-permit/"
            "/services/gdrfa-family-residence-renew/"
            "/services/issue-trade-license-dubai/"
            "/authorities/icp/"
            "/authorities/rta-dubai/"
          )
          i=0
          for route in "${urls[@]}"; do
            i=$((i+1))
            chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=5000 --dump-dom "https://hossambahr.com${route}?browser-audit=$i" > "production-browser/$i-desktop.html"
            chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=5000 --screenshot="production-browser/$i-mobile.png" "https://hossambahr.com${route}?browser-audit=$i"
          done
          python - <<'PY'
          from pathlib import Path
          import re, sys
          bad = re.compile(r'\ufffd|[ØÙ][\u0080-\u00ffŒœŠšŸŽž–-™]|(?:Ã[\u0080-\u00ff]|Â[\u0080-\u00ff]|â€|ðŸ)')
          failures=[]
          for path in Path('production-browser').glob('*-desktop.html'):
              text=path.read_text('utf-8')
              if bad.search(text): failures.append(str(path))
              if '<html' not in text.lower() or len(text) < 1000: failures.append(str(path)+':empty')
          print({'browserPages':13,'corrupted':failures})
          if failures: sys.exit(1)
          PY
      - name: Verify Dubai visibility and both execution paths in production
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          node - <<'JS'
          const { chromium } = require('playwright');
          const { execFileSync } = require('child_process');
          (async()=>{
            const executablePath=execFileSync('which',['chrome'],{encoding:'utf8'}).trim();
            const browser=await chromium.launch({headless:true,executablePath});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://hossambahr.com/services/?production-paths=1',{waitUntil:'networkidle'});
            await page.waitForSelector('[data-emirate-shortcut="دبي"]');
            await page.click('[data-emirate-shortcut="دبي"]');
            const dubaiVisible=await page.locator('[data-directory-card]:visible').count();
            const mismatches=await page.locator('[data-directory-card]:visible').evaluateAll(cards=>cards.filter(card=>!(card.dataset.emirate||'').includes('دبي')).length);
            await page.goto('https://hossambahr.com/services/issue-trade-license-dubai/?production-paths=1',{waitUntil:'networkidle'});
            const commercial=await page.locator('[data-commercial-cta="verified"][href^="https://wa.me/971503780460"]').count();
            const official=await page.locator('[data-government-cta="verified"][href^="https://"]').count();
            await page.goto('https://hossambahr.com/command-center/?production-paths=1',{waitUntil:'networkidle'});
            const commandActions=await page.locator('.command-action-grid a').count();
            const text=(await page.locator('.metric-grid').textContent()).replaceAll(',','');
            const liveMetrics=['200','2610','7','20'].every(value=>text.includes(value));
            const result={dubaiVisible,mismatches,commercial,official,commandActions,liveMetrics,errors};
            console.log(result);
            await browser.close();
            if(dubaiVisible<1||mismatches||commercial!==1||official<1||commandActions!==4||!liveMetrics||errors.length)process.exit(1);
          })();
          JS
      - name: Full-page responsive production layout audit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          export HB_NODE_MODULES="$PWD/node_modules"
          export HB_BROWSER_PATH="$(command -v chrome)"
          export HB_BASE_URL="https://hossambahr.com"
          node visual-layout-audit.mjs
      - name: Run all one hundred real customer journeys on Production
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          export HB_NODE_MODULES="$PWD/node_modules"
          export HB_BROWSER_PATH="$(command -v chrome)"
          export HB_BASE_URL="https://hossambahr.com"
          export HB_OUTPUT_DIR="$PWD/final-platform-acceptance"
          node final-platform-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-verification
          path: |
            production-browser
            visual-layout-audit
            final-platform-acceptance
          retention-days: 14
      - name: Record verified UX production acceptance
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          cat > qa/ux-production-result.json <<EOF
          {
            "status": "PASS",
            "verified_commit": "${GITHUB_SHA}",
            "production_url": "https://hossambahr.com/",
            "production_html_routes": 322,
            "representative_browser_routes": 13,
            "responsive_layout_checks": 88,
            "real_user_journeys": 100,
            "journey_browser_checks": 100,
            "corrupted_strings": 0,
            "browser_page_errors": 0
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- qa/ux-production-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified UX production acceptance [skip ci]"
            git push
          fi

