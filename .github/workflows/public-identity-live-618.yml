name: Live public identity responsive acceptance 618
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/public-identity-live-618.yml, diagnostics/public-identity-live-618.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install pinned browser runtime and Firefox
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Prepare expected current source identity
        run: |
          git fetch origin main:refs/remotes/origin/main
          git worktree add /tmp/hb-public-identity-live origin/main
          cd /tmp/hb-public-identity-live
          npm run build
      - name: Verify actual public pages across seven sizes in both browser engines
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          HB_SOURCE_SHA: b4080ad7c4c6220a396144d7b5b2f5f11fff42bc
        run: node diagnostics/public-identity-live-618.mjs
      - name: Preserve actual browser evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          if [ ! -d diagnostics/public-identity-live-618 ]; then exit 0; fi
          git add diagnostics/public-identity-live-618
          if ! git diff --cached --quiet; then
            git commit -m "Record actual bilingual public identity acceptance in Chrome and Firefox"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
