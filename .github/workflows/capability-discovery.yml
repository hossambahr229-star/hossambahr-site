name: Capability Discovery Acceptance
on:
  push:
    branches: [agent/intent-first-capability-discovery, agent/capability-menu-spacing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npm run build
      - run: node --test scripts/capability-discovery-regression.test.mjs scripts/capability-generator-integration.test.mjs
      - run: node scripts/capability-discovery-browser.mjs
        env:
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_DISCOVERY_VIEWS_ONLY: ${{ github.ref_name == 'agent/capability-menu-spacing' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-discovery-evidence
          path: artifacts/capability-discovery
