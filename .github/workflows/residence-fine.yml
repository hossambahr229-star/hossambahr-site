name: Residence fine discovery regression
on:
  push:
    branches: [agent/residence-fine-discovery]
    paths-ignore: ['artifacts/**']
permissions: {contents: write}
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node scripts/residence-fine-regression.test.mjs
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npm run build
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/residence-fine-browser.mjs
      - name: Preserve discovery preview
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add artifacts/residence-fine
          git diff --cached --quiet || git commit -m "Preserve scoped discovery preview [skip ci]"
          git push origin HEAD:agent/residence-fine-discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: residence-fine, path: artifacts/residence-fine}
