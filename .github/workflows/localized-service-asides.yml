name: Localized service sidebar publication
on:
  push:
    branches: [agent/localized-service-asides]
    paths-ignore: ['artifacts/**']
permissions: {contents: write}
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npm run build
      - run: node scripts/localized-service-asides.test.mjs
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/localized-service-asides-browser.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add artifacts/localized-service-asides
          git diff --cached --quiet || git commit -m "Preserve localized service sidebar preview [skip ci]"
          git push origin HEAD:agent/localized-service-asides
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: localized-service-asides, path: artifacts/localized-service-asides}
