name: Other Reviewed Sources Live Grounding
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['diagnostics/dld-source-review-2026-10-18/other-check.mjs','.github/workflows/other-reviewed-sources.yml']
permissions: {contents: write}
jobs:
  grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node diagnostics/dld-source-review-2026-10-18/other-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: other-reviewed-live-grounding,path: diagnostics/dld-source-review-2026-10-18}
      - name: Preserve actual response evidence
        if: always()
        run: |
          git config user.name "HossamBahr Grounding Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          git add diagnostics/dld-source-review-2026-10-18
          if ! git diff --cached --quiet; then
            git commit -m "Record other individually reviewed source grounding"
            git push origin HEAD:agent/dld-source-review-evidence
          fi
