name: Live document authentication boundary
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/live-document-auth-boundary.mjs','.github/workflows/live-document-auth-boundary.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node scripts/live-document-auth-boundary.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/document-auth-boundary-2026-10-22
          git diff --cached --quiet || git commit -m "Record actual document authentication boundary [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
