name: Production JavaScript diagnostic and final acceptance
on:
  push:
    branches: [main]
    paths:
      - "qa/production-js-diagnostic.mjs"
      - "qa/external-production-acceptance.mjs"
      - ".github/workflows/production-js-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-final-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: browser-actions/setup-chrome@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - id: diagnostic
        continue-on-error: true
        run: node qa/production-js-diagnostic.mjs
      - id: acceptance
        continue-on-error: true
        run: node qa/external-production-acceptance.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-production-browser-evidence
          path: |
            production-js-diagnostic
            external-production-artifacts
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f production-js-diagnostic/result.json
          test -f external-production-artifacts/external-production-report.json
          cp production-js-diagnostic/result.json qa/production-js-diagnostic-result.json
          cp external-production-artifacts/external-production-report.json qa/external-production-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- qa/production-js-diagnostic-result.json qa/external-production-result.json
          git diff --cached --quiet && exit 0
          git commit -m "Record final external Production verification [skip ci]"
          git push origin HEAD:main
      - if: steps.diagnostic.outcome != 'success' || steps.acceptance.outcome != 'success'
        run: exit 1
