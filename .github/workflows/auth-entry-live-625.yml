name: Live bilingual public sign-in acceptance 625
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/auth-entry-live-625.yml, diagnostics/auth-entry-live-625.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install pinned browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Verify public sign-in across locales, widths and browsers
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          HB_BASE_URL: https://hossambahr.com
          HB_OUTPUT_DIR: diagnostics/auth-entry-live-625
          HB_SOURCE_SHA: 6aff3a7ca03a9f14f8db9d4f51c2b2296951f71b
        run: node diagnostics/auth-entry-live-625.mjs
      - name: Preserve actual Production evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          if [ ! -d diagnostics/auth-entry-live-625 ]; then exit 0; fi
          git add diagnostics/auth-entry-live-625
          if ! git diff --cached --quiet; then
            git commit -m "Record live bilingual public sign-in evidence"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
