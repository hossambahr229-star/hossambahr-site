name: Isolated Auth and private file HTTP acceptance
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/isolated-auth-storage-http-20261107.yml]
permissions:
  contents: write
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c84a04cc42b154e2a8d266bb0733aecf0c32511f
          path: source
      - uses: actions/checkout@v4
        with:
          path: evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.79.0
      - name: Test synthetic accounts and vault boundaries on a local database
        working-directory: source
        shell: bash
        run: |
          set -eu
          out="$GITHUB_WORKSPACE/evidence/diagnostics/isolated-auth-storage-http-20261107"
          mkdir -p "$out"
          config_dir="$(mktemp -d)"
          (cd "$config_dir" && supabase init)
          cp "$config_dir/supabase/config.toml" supabase/config.toml
          python -c 'from pathlib import Path; import re; p=Path("supabase/config.toml"); s=p.read_text(); p.write_text(re.sub(r"(\[db\.seed\]\s*(?:#[^\n]*\s*)*enabled\s*=\s*)true", r"\g<1>false", s, count=1))'
          supabase start --help >/dev/null
          supabase test db --help >/dev/null
          if ! supabase start > "$RUNNER_TEMP/local-supabase-start.log" 2>&1; then
            printf 'Local Supabase failed to start. No hosted database was used.\n' > "$out/result.txt"
            grep -A 3 -E 'ERROR:|failed to|does not exist|invalid value' "$RUNNER_TEMP/local-supabase-start.log" | tail -15 >> "$out/result.txt" || true
            exit 1
          fi
          set -o pipefail
          supabase status -o env > "$RUNNER_TEMP/hb-local-supabase.env"
          node "$GITHUB_WORKSPACE/evidence/diagnostics/isolated-auth-storage-http-20261107.mjs" "$RUNNER_TEMP/hb-local-supabase.env" "$out" | tee "$out/result.txt"
      - name: Preserve isolated acceptance results
        if: always()
        working-directory: evidence
        shell: bash
        run: |
          test -f diagnostics/isolated-auth-storage-http-20261107/result.txt || exit 0
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/isolated-auth-storage-http-20261107
          git commit -m "Record isolated Supabase policy test results"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
