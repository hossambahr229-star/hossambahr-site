name: Mobile assistant discovery balance
on:
  push:
    branches: [agent/mobile-ai-discovery-balance]
    paths-ignore: ['artifacts/**']
permissions: {contents: write}
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npm run build
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/mobile-ai-discovery-browser.mjs
      - name: Preserve concrete mobile preview
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add artifacts/mobile-ai-discovery
          git diff --cached --quiet || git commit -m "Preserve mobile assistant discovery preview [skip ci]"
          git push origin HEAD:agent/mobile-ai-discovery-balance
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: mobile-ai-discovery, path: artifacts/mobile-ai-discovery}
