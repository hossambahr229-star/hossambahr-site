name: Measure Authority Heading Rhythm
on:
  push:
    branches: [agent/measure-authority-heading-rhythm]
    paths:
      - scripts/measure-authority-heading-rhythm.mjs
      - .github/workflows/measure-authority-heading-rhythm.yml
      - src/publication/generate-transaction-discovery.mjs
      - transaction-discovery.css
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - name: Install capture runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0 sharp@0.35.4
      - name: Capture actual published AI panel and reference overlays
        run: HB_BASE_URL=https://hossambahr.com/ HB_BROWSER_PATH="$(which chrome)" node scripts/measure-authority-heading-rhythm.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-authority-heading-rhythm
          path: artifacts/measure-authority-heading-rhythm
      - name: Preserve only new visual evidence on the diagnosis branch
        if: github.ref == 'refs/heads/agent/measure-authority-heading-rhythm'
        run: |
          git config user.name "HossamBahr Visual Diagnosis"
          git config user.email "visual-diagnosis@users.noreply.github.com"
          git add artifacts/measure-authority-heading-rhythm
          if ! git diff --cached --quiet; then
            git commit -m "Record regional live Production visual evidence [skip ci]"
            git push origin HEAD:agent/measure-authority-heading-rhythm
          fi
