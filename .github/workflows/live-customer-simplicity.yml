name: Live customer simplicity acceptance
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/live-customer-simplicity.mjs','.github/workflows/live-customer-simplicity.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0 sharp@0.35.4
      - run: node scripts/wait-customer-simplicity.mjs
      - run: HB_BROWSER_PATH="$(which chrome)" HB_BASE_URL=https://hossambahr.com HB_OUTPUT_DIR=diagnostics/customer-simplicity-2026-10-19/after node scripts/live-customer-simplicity.mjs
      - run: node scripts/customer-simplicity-diff.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/customer-simplicity-2026-10-19
          git diff --cached --quiet || git commit -m "Preserve live customer simplicity before-after evidence [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-customer-simplicity, path: diagnostics/customer-simplicity-2026-10-19}
