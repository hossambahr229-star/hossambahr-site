name: Live Provider Recheck October 9
on:
  push:
    branches: [agent/live-provider-check-oct9]
    paths:
      - scripts/live-provider-oct9.mjs
      - .github/workflows/live-provider-oct9.yml
      - src/publication/generate-transaction-discovery.mjs
      - transaction-discovery.css
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - name: Install capture runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0 sharp@0.35.4
      - name: Check public actual external model availability
        run: HB_BASE_URL=https://hossambahr.com/ HB_BROWSER_PATH="$(which chrome)" node scripts/live-provider-oct9.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-provider-oct9
          path: artifacts/live-provider-oct9
      - name: Preserve only new visual evidence on the diagnosis branch
        if: github.ref == 'refs/heads/agent/live-provider-check-oct9'
        run: |
          git config user.name "HossamBahr Visual Diagnosis"
          git config user.email "visual-diagnosis@users.noreply.github.com"
          git add artifacts/live-provider-oct9
          if ! git diff --cached --quiet; then
            git commit -m "Record regional live Production visual evidence [skip ci]"
            git push origin HEAD:agent/live-provider-check-oct9
          fi
