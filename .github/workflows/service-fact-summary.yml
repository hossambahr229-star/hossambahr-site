name: Service Fact Summary Clipping Regression
on:
  push:
    branches: [agent/service-fact-summary-links]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm run build
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
      - name: Verify complete fact summaries and real detail navigation
        run: HB_BROWSER_PATH="$(which chrome)" node scripts/service-fact-summary-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-fact-summary-preview
          path: diagnostics/service-fact-summary-preview
