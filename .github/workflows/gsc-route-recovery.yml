name: Recover observed Google legacy routes
on:
  push:
    branches: [agent/gsc-route-recovery-20261124]
    paths-ignore: ['artifacts/**','**/*.html']
permissions: {contents: write}
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0
      - run: npm run typecheck && node --check src/publication/historical-route-aliases.mjs && node --check customer-intake.js
      - run: npm run build
      - run: node --test scripts/historical-route-aliases.test.mjs
      - name: Preserve the service registry, indexable URL set and homepage
        run: |
          git diff --exit-code 713bbd47d2773d49a7d8c25cca3b7c26c5dc8e39 -- src/registry/published-services.json transaction-discovery-data.json index.html en/index.html
          git show 713bbd47d2773d49a7d8c25cca3b7c26c5dc8e39:sitemap.xml > /tmp/hb-before-alias-sitemap.xml
          node --input-type=module - <<'JS'
          import {readFile} from 'node:fs/promises';import assert from 'node:assert/strict';
          const before=await readFile('/tmp/hb-before-alias-sitemap.xml','utf8'),after=await readFile('sitemap.xml','utf8'),urls=s=>[...s.matchAll(/<loc>(.*?)<\/loc>/g)].map(x=>x[1]).sort();
          assert.deepEqual(urls(after),urls(before));const aliases=JSON.parse(await readFile('content/gsc-historical-route-aliases.json','utf8')).entries;for(const e of aliases)assert.ok(!urls(after).includes('https://hossambahr.com'+e.from));
          console.log({indexableURLs:urls(after).length,aliasesExcluded:aliases.length});
          JS
      - run: node scripts/historical-route-recovery-browser.mjs
        env: {HB_BROWSER_PATH: /usr/bin/google-chrome}
      - name: Commit only generated compatibility entries and versioned intake pages
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          node --input-type=module - <<'JS'
          import {readFile} from 'node:fs/promises';import {execFileSync} from 'node:child_process';
          const m=JSON.parse(await readFile('content/gsc-historical-route-aliases.json','utf8'));execFileSync('git',['add','--',...m.entries.map(e=>e.from.slice(1)),'contact/index.html','en/contact/index.html','pricing/index.html','en/pricing/index.html','artifacts/gsc-route-recovery']);
          JS
          git diff --cached --quiet || git commit -m "Publish verified legacy aliases and request-context recovery [skip ci]"
          git push origin HEAD:agent/gsc-route-recovery-20261124
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: gsc-route-recovery, path: artifacts/gsc-route-recovery}
