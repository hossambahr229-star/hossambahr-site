name: Arabic service labels
on:
  push:
    branches: [agent/arabic-service-labels]
permissions: {contents: read}
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npm run build
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/arabic-service-labels-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: arabic-service-labels, path: artifacts/arabic-service-labels}
