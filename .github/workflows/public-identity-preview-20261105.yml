name: Public identity continuity preview
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/public-identity-preview-20261105.yml, diagnostics/public-identity-source/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Prepare isolated current source
        run: |
          git fetch origin main:refs/remotes/origin/main
          git worktree add /tmp/hb-public-identity origin/main
          mkdir -p /tmp/hb-public-identity/src/design
          cp diagnostics/public-identity-source/public-identity.mjs /tmp/hb-public-identity/src/design/
          cp diagnostics/public-identity-source/apply-public-identity.mjs /tmp/hb-public-identity/src/publication/
          cd /tmp/hb-public-identity
          npm install --no-save --no-package-lock playwright@1.55.0 sharp@0.35.4
          npm run build
      - name: Capture before and after in both languages
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node diagnostics/public-identity-source/preview.mjs
      - name: Preserve accepted layout and customer journeys
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          cd /tmp/hb-public-identity
          node scripts/reference-geometry-gate.mjs
          node scripts/transaction-discovery-gate.mjs
      - name: Preserve preview evidence without publishing the design
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/public-identity-preview-20261105-v4
          if ! git diff --cached --quiet; then
            git commit -m "Capture before and after public identity continuity prototype"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
