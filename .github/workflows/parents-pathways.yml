name: Live parents browser pathways
on:
  push:
    branches: [agent/parents-pathways-regression]
    paths-ignore: ['artifacts/**']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --check final-platform-acceptance.mjs
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/parents-pathways-browser.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add artifacts/parents-pathways
          git diff --cached --quiet || git commit -m "Preserve real parents browser pathways [skip ci]"
          git push origin HEAD:agent/parents-pathways-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-parents-pathways, path: artifacts/parents-pathways}
