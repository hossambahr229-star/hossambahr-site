name: Reviewed MOHRE Field Acceptance
on:
  push:
    branches: [agent/mohre-recorded-facts-oct16]
permissions:
  contents: read
jobs:
  recorded-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: node --test scripts/mohre-recorded-facts-oct16.test.mjs
