name: Chat business activity discovery
on:
  push:
    branches: [agent/chat-activity-discovery]
permissions: {contents: write}
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: node --check public-ai-concierge.js
      - run: node --test scripts/rera-clarification-actions.test.mjs scripts/food-activity-scope.test.mjs
      - run: npm run build
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/chat-activity-discovery-browser.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add artifacts/chat-activity-discovery
          git diff --cached --quiet || git commit -m "Record chat activity navigation preview [skip ci]"
          git push origin HEAD:agent/chat-activity-discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: chat-activity-discovery, path: artifacts/chat-activity-discovery}
