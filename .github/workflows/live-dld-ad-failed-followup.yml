name: Live DLD Ad Failed Cases
on:
  push:
    branches: [agent/live-dld-ad-failed-followup]
    paths: [scripts/live-dld-ad-failed-followup.mjs, .github/workflows/live-dld-ad-failed-followup.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node scripts/live-dld-ad-failed-followup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-dld-ad-failed-followup
          path: artifacts/live-dld-ad-failed-followup
      - name: Preserve live evidence
        if: always()
        run: |
          git config user.name "HossamBahr Production Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          git fetch origin agent/live-dld-ad-failed-followup
          git reset --mixed origin/agent/live-dld-ad-failed-followup
          git add artifacts/live-dld-ad-failed-followup
          if ! git diff --cached --quiet; then
            git commit -m "Record only failed DLD ad AI Production cases [skip ci]"
            git push origin HEAD:agent/live-dld-ad-failed-followup
          fi
