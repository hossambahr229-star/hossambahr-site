name: Current External Model Status One Probe
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/live-provider-status-20261024.mjs','.github/workflows/live-provider-status-20261024.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
      - run: HB_SCOPE=ai HB_BROWSER_PATH="$(which chrome)" HB_BASE_URL=https://hossambahr.com HB_OUTPUT_DIR=diagnostics/provider-status-2026-10-24-current node scripts/live-provider-status-20261024.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/provider-status-2026-10-24-current
          git diff --cached --quiet || git commit -m "Record one current external provider probe [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: external-provider-current-20261024, path: diagnostics/provider-status-2026-10-24-current}
