name: Reviewed DLD Sources Live Grounding
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['diagnostics/dld-source-review-2026-10-18/check.mjs','.github/workflows/dld-reviewed-sources.yml']
permissions: {contents: write}
jobs:
  grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Allow the existing 10-minute catalog cache to expire
        run: |
          node --input-type=module <<'NODE'
          const remaining=Date.parse('2026-10-18T07:17:10Z')-Date.now();
          if(remaining>0)await new Promise(r=>setTimeout(r,Math.min(remaining,660000)));
          NODE
      - run: node diagnostics/dld-source-review-2026-10-18/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: reviewed-dld-live-grounding,path: diagnostics/dld-source-review-2026-10-18}
      - name: Preserve actual response evidence
        if: always()
        run: |
          git config user.name "HossamBahr Grounding Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          git add diagnostics/dld-source-review-2026-10-18
          if ! git diff --cached --quiet; then
            git commit -m "Record targeted live DLD source grounding"
            git push origin HEAD:agent/dld-source-review-evidence
          fi
