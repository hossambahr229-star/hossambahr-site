name: Final Production Correction Gate

on:
  push:
    branches:
      - agent/final-production-correction
      - main
      - agent/production-layout-centering
    paths-ignore:
      - 'supabase/**'
      - 'diagnostics/**'

permissions:
  contents: write

concurrency:
  group: final-production-correction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser audit runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0 sharp@0.35.4
      - name: Build from the central registry
        run: npm run build
      - name: Type and architecture gates
        run: |
          npm run typecheck
          npm run test:architecture
      - name: Phase 9.1 visual quality gate
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_OUTPUT_DIR: artifacts/phase9-1-visual-quality
        run: npm run test:phase9-1-visual
      - name: Browser route and customer-journey gates
        # Production has a dedicated browser-verification workflow that scans
        # every route and runs the full journey suite. Avoid running the same
        # long browser matrix twice on main and exhausting this gate's timeout.
        if: ${{ github.ref_name != 'main' && !contains(github.event.head_commit.message, '[external recheck]') }}
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          HB_BROWSER_PATH: /usr/bin/google-chrome
        run: |
          npm run audit:a-plus-plus
          node visual-layout-audit.mjs
          npm run test:final-platform
      - name: Audit official government destinations
        env:
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_EXTERNAL_CONCURRENCY: 16
        run: node src/publication/audit-official-links.mjs
      - name: Commit the verified generated site
        if: (github.ref_name == 'agent/final-production-correction' || github.ref_name == 'main') && !contains(github.event.head_commit.message, '[verified generated site]')
        run: |
          git config user.name "HossamBahr Release Gate"
          git config user.email "release-gate@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated site is already synchronized."
          else
            git commit -m "Synchronize verified generated site [verified generated site] [skip ci]"
            git fetch origin ${{ github.ref_name }}
            REMOTE_HEAD="$(git rev-parse origin/${{ github.ref_name }})"
            if [ "$REMOTE_HEAD" != "${{ github.sha }}" ]; then
              echo "Remote branch advanced to $REMOTE_HEAD; a newer release gate owns synchronization."
              exit 0
            fi
            if ! git push origin HEAD:${{ github.ref_name }}; then
              git fetch origin ${{ github.ref_name }}
              REMOTE_HEAD="$(git rev-parse origin/${{ github.ref_name }})"
              if [ "$REMOTE_HEAD" != "${{ github.sha }}" ]; then
                echo "Remote branch advanced during push; treating this run as superseded."
                exit 0
              fi
              echo "Generated-site push failed without a newer remote commit."
              exit 1
            fi
          fi
      - name: Wait for and byte-verify live Production
        id: live_bytes
        if: github.ref_name == 'main'
        run: node src/publication/verify-live-production.mjs
      # Live conversational/customer-journey verification is owned by
      # production-browser-verification.yml on main to avoid duplicate public-AI
      # traffic and race/rate-limit noise across concurrent release gates.


      - name: Audit all live public routes and 200 bilingual customer service paths
        if: github.ref_name == 'main'
        env:
          HB_BASE_URL: https://hossambahr.com
          HB_OUTPUT_DIR: artifacts/production-reference
        run: |
          export HB_DEPLOYED_SHA="$(git rev-parse HEAD)"
          node src/publication/audit-live-customer-routes.mjs
      - name: Capture actual Production geometry and reference comparison
        if: always() && github.ref_name == 'main' && steps.live_bytes.outcome == 'success'
        env:
          HB_BASE_URL: https://hossambahr.com/
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_OUTPUT_DIR: artifacts/production-reference
        run: |
          export HB_DEPLOYED_SHA="$(git rev-parse HEAD)"
          node scripts/reference-geometry-gate.mjs
      - name: Preserve actual Production evidence
        if: always() && github.ref_name == 'main' && steps.live_bytes.outcome == 'success'
        run: |
          git fetch origin main
          EXPECTED_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git rev-parse origin/main)"
          if [ "$REMOTE_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "A newer release owns Production; evidence is not committed."
            exit 0
          fi
          git config user.name "HossamBahr Release Gate"
          git config user.email "release-gate@users.noreply.github.com"
          git add artifacts/production-reference
          if ! git diff --cached --quiet; then
            git commit -m "Record live Production geometry evidence [verified generated site] [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload live comparison evidence
        if: always() && github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: actual-production-reference
          path: artifacts/production-reference
