name: Final Production Correction Gate

on:
  push:
    branches:
      - agent/final-production-correction
      - main

permissions:
  contents: write

concurrency:
  group: final-production-correction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser audit runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Build from the central registry
        run: npm run build
      - name: Type and architecture gates
        run: |
          npm run typecheck
          npm run test:architecture
      - name: Browser route and customer-journey gates
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          HB_BROWSER_PATH: /usr/bin/google-chrome
        run: |
          npm run audit:a-plus-plus
          npm run test:final-platform
      - name: Audit official government destinations
        run: node src/publication/audit-official-links.mjs
      - name: Commit the verified generated site on the correction branch
        if: github.ref_name == 'agent/final-production-correction' && !contains(github.event.head_commit.message, '[verified generated site]')
        run: |
          git config user.name "HossamBahr Release Gate"
          git config user.email "release-gate@users.noreply.github.com"
          git add -A -- ':!node_modules' ':!artifacts'
          if git diff --cached --quiet; then
            echo "Generated site is already synchronized."
          else
            git commit -m "Synchronize verified production data [verified generated site] [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Wait for and byte-verify live Production
        if: github.ref_name == 'main'
        run: node src/publication/verify-live-production.mjs
      - name: Browser-verify live Production journeys
        if: github.ref_name == 'main'
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_BASE_URL: https://hossambahr.com
          HB_OUTPUT_DIR: artifacts/live-production-acceptance
        run: npm run test:final-platform
