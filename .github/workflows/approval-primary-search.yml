name: Approval primary search usability
on:
  push:
    branches: [agent/approval-primary-search]
permissions: {contents: read}
jobs:
  usability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npm run build
      - run: node src/publication/generate-transaction-discovery.mjs
      - run: node --test scripts/approval-operation-regression.test.mjs scripts/capability-discovery-regression.test.mjs scripts/capability-generator-integration.test.mjs
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/approval-primary-search-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: approval-primary-search, path: artifacts/approval-primary-search}
