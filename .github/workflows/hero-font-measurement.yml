name: Hero Font Measurement
on:
  push:
    branches: [agent/hero-font-measurement]
    paths: [scripts/hero-font-measurement.mjs, .github/workflows/hero-font-measurement.yml]
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock playwright@1.55.0 sharp@0.35.4
      - run: npm run build
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hb-font-preview.log 2>&1 &
          HB_BROWSER_PATH="$(which chrome)" node scripts/hero-font-measurement.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: hero-font-measurement, path: artifacts/hero-font-measurement}
      - name: Preserve measured evidence
        if: always()
        run: |
          git config user.name "HossamBahr Visual Evidence"
          git config user.email "visual-evidence@users.noreply.github.com"
          git add artifacts/hero-font-measurement
          if ! git diff --cached --quiet; then
            git commit -m "Record headline font measurements [skip ci]"
            git push origin HEAD:agent/hero-font-measurement
          fi
