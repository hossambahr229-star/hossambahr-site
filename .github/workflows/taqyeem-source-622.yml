name: Taqyeem guidance source acceptance 622
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/taqyeem-source-622.yml, diagnostics/taqyeem-browser-622.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install pinned browser runtime and Firefox
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Prepare exact proposed source
        run: |
          git fetch origin agent/taqyeem-guidance-route-20261105
          git worktree add /tmp/hb-taqyeem-source 446bf5cb00c0be2012044d6d48b4a3ad787cc834
          cd /tmp/hb-taqyeem-source
          npm run build
      - name: Verify scoped facts, disclosures and both pathways
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          HB_SOURCE_SHA: 446bf5cb00c0be2012044d6d48b4a3ad787cc834
        run: node diagnostics/taqyeem-browser-622.mjs
      - name: Preserve actual source browser evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          if [ ! -d diagnostics/taqyeem-source-622 ]; then exit 0; fi
          git add diagnostics/taqyeem-source-622
          if ! git diff --cached --quiet; then
            git commit -m "Record scoped hospitality source browser pathways and fee isolation"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
