name: Identify latest production browser and publication checks after PR 633
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/production-browser-run-index-20261107.yml]
permissions:
  actions: read
  contents: write
jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the current workflow run IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics/production-browser-run-index-20261107
          for w in production-browser-verification.yml final-production-correction.yml; do
            gh run list --workflow "$w" --limit 8 --json databaseId,headSha,conclusion,status,url > "diagnostics/production-browser-run-index-20261107/${w%.yml}.json"
          done
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/production-browser-run-index-20261107
          git commit -m "Record current production verification run IDs"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
