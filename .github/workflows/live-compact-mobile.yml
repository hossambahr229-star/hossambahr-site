name: Live compact mobile assistant verification
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['.github/workflows/live-compact-mobile.yml', 'scripts/live-compact-mobile.mjs']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Wait for the published mobile source
        run: |
          node --input-type=module -e "for(let n=0;n<30;n++){const t=await (await fetch('https://hossambahr.com/home-geometry.css?mobile509='+Date.now())).text();if(t.includes('Keep the mobile subtitle inside its text column'))process.exit(0);await new Promise(r=>setTimeout(r,15000));}throw Error('Latest mobile source not yet published');"
      - run: HB_BASE_URL=https://hossambahr.com HB_BROWSER_PATH="$(which chrome)" HB_OUTPUT_DIR=diagnostics/mobile-ai-production-2026-10-19 node scripts/live-compact-mobile.mjs
      - name: Preserve real Production evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/mobile-ai-production-2026-10-19
          git diff --cached --quiet || git commit -m "Preserve live compact mobile evidence [skip ci]"
          git push origin HEAD:agent/dld-source-review-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-compact-mobile, path: diagnostics/mobile-ai-production-2026-10-19}
