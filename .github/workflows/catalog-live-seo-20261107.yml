name: Current production canonical service and sharing audit
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/catalog-live-seo-20261107.yml, diagnostics/catalog-live-seo-20261107.mjs]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node diagnostics/catalog-live-seo-20261107.mjs
      - name: Preserve public crawl results
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/catalog-live-seo-20261107/report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record current canonical service crawl"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
