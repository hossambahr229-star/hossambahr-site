name: Live Recorded Activity Breadth Acceptance
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['.github/workflows/live-home-activity-breadth-20261023.yml']
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OUTPUT_DIR: diagnostics/home-activity-breadth-production-2026-10-23-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 0146d012d727aa665ae869345810912092dd12f8
          path: site
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
        working-directory: site
      - name: Wait for the exact published discovery runtime fingerprint
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const hash=createHash('sha256');
          for(const file of ['transaction-discovery.js','transaction-discovery.css','service-capabilities.js','activity-discovery.js','business-activities-discovery.js'])hash.update(await readFile('site/'+file));
          const expected=hash.digest('hex').slice(0,12);
          const activitySource=await readFile('site/dubai-activities-data.js','utf8');
          const activityCount=JSON.parse(activitySource.slice(activitySource.indexOf('=')+1).replace(/;\s*$/,'')).length;
          let ready=false;
          for(let i=0;i<45;i++){
            try{
              const ar=await fetch('https://hossambahr.com/',{cache:'no-store'}).then(r=>r.text());
              const en=await fetch('https://hossambahr.com/en/',{cache:'no-store'}).then(r=>r.text());
              if(ar.includes('/transaction-discovery.js?v='+expected)&&en.includes('/transaction-discovery.js?v='+expected)&&ar.includes(activityCount+' نشاط مسجل · دبي')&&en.includes(activityCount+' recorded activities · Dubai')){ready=true;break;}
            }catch{}
            await new Promise(r=>setTimeout(r,20000));
          }
          if(!ready)throw Error('The expected scoped discovery runtime is not published in both locales: '+expected);
          NODE
      - name: Verify actual recorded activity count, responsive rendering and directory links
        working-directory: site
        run: |
          HB_BROWSER_PATH="$(which chrome)" node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const source=await readFile('dubai-activities-data.js','utf8');
          const count=JSON.parse(source.slice(source.indexOf('=')+1).replace(/;\s*$/,'')).length;
          const out=process.env.OUTPUT_DIR;await mkdir(out,{recursive:true});
          const report={captureSource:'LIVE_PRODUCTION',recordedActivities:count,jurisdiction:'Dubai only',requirementsVerification:'NOT_IMPLIED',views:[],journeys:[]};
          const browser=await chromium.launch({headless:true,executablePath:process.env.HB_BROWSER_PATH});
          try{
           const page=await browser.newPage();
           for(const locale of ['ar','en'])for(const width of [320,390,1440]){
            const p=locale==='en'?'/en':'';
            await page.setViewportSize({width,height:width<600?844:1000});
            await page.goto('https://hossambahr.com'+p+'/',{waitUntil:'domcontentloaded'});
            await page.locator('[data-business-domain="activities"]').waitFor();await page.evaluate(()=>document.fonts.ready);
            const link=page.locator('[data-business-domain="activities"]');
            assert.ok((await link.innerText()).includes(count+(locale==='en'?' recorded activities · Dubai':' نشاط مسجل · دبي')));
            assert.equal(await link.getAttribute('href'),p+'/business-activities/');
            const metrics=await page.locator('[data-home-domains]').evaluate(e=>({height:e.getBoundingClientRect().height,overflow:document.documentElement.scrollWidth>innerWidth+1,clipped:[...e.querySelectorAll('a')].filter(x=>x.scrollWidth>x.clientWidth+2).length,domains:e.querySelectorAll('[data-business-domain]').length,direct:e.querySelectorAll('[data-home-service]').length}));
            assert.equal(metrics.overflow,false);assert.equal(metrics.clipped,0);assert.equal(metrics.domains,11);assert.equal(metrics.direct,11);
            await page.screenshot({path:out+'/'+locale+'-'+width+'-home.png'});
            await page.locator('[data-home-domains]').screenshot({path:out+'/'+locale+'-'+width+'-services.png'});
            report.views.push({locale,width,...metrics,status:'PASS'});
            if(width===390){await link.click();await page.waitForURL('**'+p+'/business-activities/');await page.locator('[data-activity-discovery]').waitFor();report.journeys.push({locale,destination:p+'/business-activities/',status:'PASS'});}
           }
           report.status='PASS';
          }catch(e){report.status='FAIL';report.error=e.stack;process.exitCode=1;}
          finally{await writeFile(out+'/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));await browser.close();}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-activity-breadth-production-2026-10-23-${{ github.run_attempt }}
          path: site/${{ env.OUTPUT_DIR }}
      - name: Retain live evidence without overwriting prior attempts
        if: always()
        run: |
          git config user.name "HossamBahr Production Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          if [ -d "site/$OUTPUT_DIR" ]; then
            mkdir -p diagnostics
            cp -R "site/$OUTPUT_DIR" diagnostics/
            git add "$OUTPUT_DIR"
            if ! git diff --cached --quiet; then
              git commit -m "Record compact discovery Production evidence [skip ci]"
              git pull --rebase --autostash origin agent/dld-source-review-evidence
              git push origin HEAD:agent/dld-source-review-evidence
            fi
          fi
