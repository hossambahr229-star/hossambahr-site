name: Live GDRFA Fine Grounding
on:
  push:
    branches: [agent/live-gdrfa-fine-grounding]
    paths:
      - scripts/live-gdrfa-fine-grounding.mjs
      - .github/workflows/live-gdrfa-fine-grounding.yml
      - src/publication/generate-transaction-discovery.mjs
      - transaction-discovery.css
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - name: Install capture runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0 sharp@0.35.4
      - name: Verify new public GDRFA facts and grounded document answers
        run: HB_BASE_URL=https://hossambahr.com/ HB_BROWSER_PATH="$(which chrome)" node scripts/live-gdrfa-fine-grounding.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-gdrfa-fine-grounding
          path: artifacts/live-gdrfa-fine-grounding
      - name: Preserve only new visual evidence on the diagnosis branch
        if: always() && github.ref == 'refs/heads/agent/live-gdrfa-fine-grounding'
        run: |
          git config user.name "HossamBahr Visual Diagnosis"
          git config user.email "visual-diagnosis@users.noreply.github.com"
          git add artifacts/live-gdrfa-fine-grounding
          if ! git diff --cached --quiet; then
            git commit -m "Record targeted GDRFA real Production evidence [skip ci]"
            git push origin HEAD:agent/live-gdrfa-fine-grounding
          fi
