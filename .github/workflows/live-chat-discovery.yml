name: Live chat discovery and mobile labels
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/live-chat-discovery.mjs','.github/workflows/live-chat-discovery.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: node scripts/wait-chat-discovery.mjs
      - run: HB_BROWSER_PATH="$(which chrome)" HB_BASE_URL=https://hossambahr.com HB_OUTPUT_DIR=diagnostics/chat-discovery-production-2026-10-20 node scripts/live-chat-discovery.mjs
      - run: HB_BROWSER_PATH="$(which chrome)" HB_BASE_URL=https://hossambahr.com HB_OUTPUT_DIR=diagnostics/mobile-labels-production-2026-10-20 node scripts/live-mobile-labels.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/chat-discovery-production-2026-10-20 diagnostics/mobile-labels-production-2026-10-20
          git diff --cached --quiet || git commit -m "Record actual chat navigation and mobile label acceptance [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-discovery-production
          path: |
            diagnostics/chat-discovery-production-2026-10-20
            diagnostics/mobile-labels-production-2026-10-20
