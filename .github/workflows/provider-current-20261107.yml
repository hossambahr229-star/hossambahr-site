name: Current Production HB AI provider status
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/provider-current-20261107.yml, diagnostics/provider-current-20261107.mjs]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node diagnostics/provider-current-20261107.mjs
      - name: Preserve redacted provider outcome
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/provider-current-20261107/report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record redacted external provider status"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
