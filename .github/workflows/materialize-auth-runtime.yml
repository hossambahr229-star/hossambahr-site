name: Validate Auth Runtime Publication

on:
  push:
    branches: [main]
    paths:
      - "auth-config.js"
      - "src/auth/apply-auth-runtime.mjs"
      - "_headers"
      - "supabase/config.toml"
      - "auth-client.js"
      - ".github/workflows/materialize-auth-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: materialize-auth-runtime-main
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[auth runtime sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Materialize Supabase/Auth runtime into static HTML
        run: node src/auth/apply-auth-runtime.mjs
      - name: Reject legacy Supabase project references
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --include='*.html' 'bbddlpvxjowphkagvycz' auth account owner os services 2>/dev/null; then
            echo "::error::Legacy Supabase project reference remains in interactive HTML."
            exit 1
          fi
          grep -q 'ngcrkuykfqmiqhsnpcrc' auth/index.html
          grep -q '/auth-client.js' os/index.html
      - name: Use the verified full-site publisher
        run: |
          echo "Auth runtime validation completed."
          echo "The full npm run build and Final Production Correction Gate publish these files."
          echo "This validation workflow never writes a partial generated site to main."
