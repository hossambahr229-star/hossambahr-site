name: Customer simplicity homepage
on:
  push:
    branches: [agent/customer-simplicity-home]
    paths-ignore: ['artifacts/**']
permissions: {contents: write}
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npm run build
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/customer-simplicity-browser.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add artifacts/customer-simplicity
          git diff --cached --quiet || git commit -m "Preserve customer simplicity preview [skip ci]"
          git push origin HEAD:agent/customer-simplicity-home
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: customer-simplicity, path: artifacts/customer-simplicity}
