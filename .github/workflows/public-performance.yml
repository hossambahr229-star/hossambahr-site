name: Public performance lab sample
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Final Production Correction Gate]
    types: [completed]
permissions:
  contents: read
jobs:
  sample:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Measure actual Production in isolated browser contexts
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/public-performance-sample.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-performance-lab
          path: artifacts/public-performance/report.json
          retention-days: 30
