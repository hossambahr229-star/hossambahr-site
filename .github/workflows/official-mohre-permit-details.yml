name: Official GDRFA Expanded Details
on:
  push:
    branches: [agent/official-mohre-permit-details]
    paths: [scripts/official-mohre-permit-details.mjs, .github/workflows/official-mohre-permit-details.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Read official cards without applying or signing in
        run: HB_BROWSER_PATH="$(which chrome)" node scripts/official-mohre-permit-details.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-missing-details
          path: artifacts/official-mohre-permit-details
      - name: Preserve live evidence only
        if: always()
        run: |
          git config user.name "HossamBahr Production Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          git fetch origin agent/official-mohre-permit-details
          git reset --mixed origin/agent/official-mohre-permit-details
          git add artifacts/official-mohre-permit-details
          if ! git diff --cached --quiet; then
            git commit -m "Record read-only official card evidence [skip ci]"
            git push origin HEAD:agent/official-mohre-permit-details
          fi
