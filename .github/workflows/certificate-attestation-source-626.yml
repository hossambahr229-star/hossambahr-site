name: Certificate attestation source browser acceptance 626
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/certificate-attestation-source-626.yml, diagnostics/certificate-attestation-browser-626.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install pinned browser runtime and Firefox
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Prepare exact proposed source
        run: |
          git fetch origin agent/certificate-attestation-discovery-20261106
          git worktree add /tmp/hb-certificate-attestation-source 5126cbe35ff91dd24370da3cd17ba0759d582b60
          cd /tmp/hb-certificate-attestation-source
          npm run build
      - name: Verify exact personal attestation and both pathways
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          HB_SOURCE_SHA: 5126cbe35ff91dd24370da3cd17ba0759d582b60
        run: node diagnostics/certificate-attestation-browser-626.mjs
      - name: Preserve actual source browser evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          if [ ! -d diagnostics/certificate-attestation-source-626 ]; then exit 0; fi
          git add diagnostics/certificate-attestation-source-626
          if ! git diff --cached --quiet; then
            git commit -m "Record exact certificate attestation source browser pathways"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
