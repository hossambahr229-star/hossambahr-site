name: ICP English expanded requirements Production verification
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/live-icp-renewal-en-verified.mjs','.github/workflows/live-icp-renewal-en-verified-ai.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: HB_SCOPE=ai HB_BROWSER_PATH="$(which chrome)" HB_BASE_URL=https://hossambahr.com HB_OUTPUT_DIR=diagnostics/icp-renewal-en-verified-2026-10-23 node scripts/live-icp-renewal-en-verified.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/icp-renewal-en-verified-2026-10-23
          git diff --cached --quiet || git commit -m "Record live common ICP conditions acceptance [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: icp-renewal-common-guidance-verified-production, path: diagnostics/icp-renewal-en-verified-2026-10-23}
