name: Complete Remaining Live Geometry Gates
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['.github/workflows/live-remaining-geometry-20261023.yml']
permissions:
  contents: write
jobs:
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5dc7ce8cb5d5f81793417657d522391b400f14d1
          path: site
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0 sharp@0.35.4
        working-directory: site
      - name: Measure actual published geometry with trailing-origin configuration
        working-directory: site
        run: HB_BROWSER_PATH="$(which chrome)" HB_BASE_URL=https://hossambahr.com/ HB_OUTPUT_DIR=diagnostics/remaining-live-geometry-2026-10-23/geometry node scripts/reference-geometry-gate.mjs
      - name: Complete actual discovery and handoff gate
        working-directory: site
        run: HB_BROWSER_PATH="$(which chrome)" HB_BASE_URL=https://hossambahr.com HB_OUTPUT_DIR=diagnostics/remaining-live-geometry-2026-10-23/discovery node scripts/transaction-discovery-gate.mjs
      - name: Complete responsive capability views only
        working-directory: site
        run: HB_BROWSER_PATH="$(which chrome)" HB_BASE_URL=https://hossambahr.com HB_DISCOVERY_VIEWS_ONLY=1 HB_OUTPUT_DIR=diagnostics/remaining-live-geometry-2026-10-23/capabilities node scripts/capability-discovery-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-live-geometry-2026-10-23
          path: site/diagnostics/remaining-live-geometry-2026-10-23
      - name: Retain independent live evidence
        if: always()
        run: |
          git config user.name "HossamBahr Production Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          if [ -d site/diagnostics/remaining-live-geometry-2026-10-23 ]; then
            mkdir -p diagnostics
            cp -R site/diagnostics/remaining-live-geometry-2026-10-23 diagnostics/
            git add diagnostics/remaining-live-geometry-2026-10-23
            if ! git diff --cached --quiet; then
              git commit -m "Record remaining real Production geometry gates [skip ci]"
              git pull --rebase --autostash origin agent/dld-source-review-evidence
              git push origin HEAD:agent/dld-source-review-evidence
            fi
          fi
