name: Global OS Architecture Checks

on:
  pull_request:
    paths:
      - "src/global/**"
      - "supabase/migrations/**"
      - "global-os-client.js"
      - "global-os.css"
      - "src/auth/apply-auth-runtime.mjs"
      - "test/architecture/**"
      - ".github/workflows/global-os-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax checks
        run: |
          node --check src/global/core/domain-model.mjs
          node --check src/global/policy/policy-engine.mjs
          node --check src/global/workflow/workflow-engine.mjs
          node --check src/global/country-packs/uae.mjs
          node --check src/global/ai/agent-contracts.mjs
          node --check global-os-client.js
          node --check src/auth/apply-auth-runtime.mjs
      - name: Architecture tests
        run: node --test test/architecture/*.test.mjs
