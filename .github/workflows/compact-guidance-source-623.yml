name: Compact guidance source acceptance 623
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/compact-guidance-source-623.yml, diagnostics/compact-guidance-browser-623.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install pinned browser runtime and Firefox
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Prepare exact proposed source
        run: |
          git fetch origin agent/compact-guidance-facts-20261105
          git worktree add /tmp/hb-compact-source cd4bbd50ca948ce96cd79a7af5956ea777caecdc
          cd /tmp/hb-compact-source
          npm run build
      - name: Verify scoped facts, disclosures and both pathways
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          HB_SOURCE_SHA: cd4bbd50ca948ce96cd79a7af5956ea777caecdc
        run: node diagnostics/compact-guidance-browser-623.mjs
      - name: Preserve actual source browser evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          if [ ! -d diagnostics/compact-guidance-source-623 ]; then exit 0; fi
          git add diagnostics/compact-guidance-source-623
          if ! git diff --cached --quiet; then
            git commit -m "Record scoped hospitality source browser pathways and fee isolation"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
