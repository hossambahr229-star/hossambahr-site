name: Original service social identity preview
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/social-identity-preview-20261105.yml, diagnostics/social-identity-source/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
      - name: Prepare an isolated copy of actual source and bundled brand assets
        run: |
          git fetch origin main:refs/remotes/origin/main
          git worktree add /tmp/hb-social-preview origin/main
          mkdir -p /tmp/hb-social-preview/src/design
          cp diagnostics/social-identity-source/brand-system.mjs /tmp/hb-social-preview/src/design/
          cp diagnostics/social-identity-source/service-social-card.mjs /tmp/hb-social-preview/src/design/
          cd /tmp/hb-social-preview
          npm install --no-save --package-lock=false playwright@1.55.0
          node src/registry/generate-published-registry.mjs
      - name: Render eleven semantic families in Arabic and English
        run: node diagnostics/social-identity-source/preview.mjs
      - name: Preserve visual prototypes without publishing them
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/social-identity-preview-20261105-v2
          git commit -m "Render original service-specific social identity previews from the current catalog"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
