name: Exact Government Choice Labels Live
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['.github/workflows/full-platform-review-live.yml']
permissions: {contents: write}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Actual desktop and phone browser journeys
        env: {HB_BROWSER_PATH: /usr/bin/google-chrome}
        run: |
          node --input-type=module <<'NODE'
          import{chromium}from'playwright';import{mkdir,writeFile}from'node:fs/promises';import assert from'node:assert/strict';
          const out='diagnostics/icp-exact-labels-live',base='https://hossambahr.com',slug="تأشيرة-استكشاف-فرص-عمل-عبر-icp-خارج-دبي";await mkdir(out,{recursive:true});const browser=await chromium.launch({headless:true,executablePath:process.env.HB_BROWSER_PATH}),views=[];
          try{for(const width of[1440,390]){
           const page=await browser.newPage({viewport:{width,height:width===390?844:960},deviceScaleFactor:1});page.setDefaultTimeout(30000);const errors=[];page.on('pageerror',e=>errors.push(e.message));
           await page.goto(base+'/services/'+slug+'/',{waitUntil:'networkidle'});await page.waitForFunction(()=>document.querySelector('.service-decision-nav'));
           assert.equal(await page.evaluate(()=>innerWidth),width);assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));
           const choices=page.locator('#official-route .exact-route-choices a[href*="/issueVisa/request/"]');assert.equal(await choices.count(),3);
           for(const [i,days]of[60,90,120].entries()){assert.ok((await choices.nth(i).innerText()).includes(String(days)));assert.ok((await choices.nth(i).getAttribute('href')).includes('/request/'+[939,941,942][i]+'/'));}
           assert.equal(await page.locator('.phase2-execution-paths [data-hb-pathways]').count(),0);
           await page.locator('#service-execution-options [data-government-duration-selection]').click();
           await page.waitForFunction(()=>{const section=document.querySelector('#official-variant-options'),last=section?.querySelector('[data-official-variant-days="120"]');if(!last)return false;return section.getBoundingClientRect().top>=0&&last.getBoundingClientRect().bottom<=innerHeight;});
           assert.equal(new URL(page.url()).hash,'#official-variant-options');await page.screenshot({path:out+'/ar-duration-cards-'+width+'.png'});assert.deepEqual(errors,[]);
           views.push({width,status:'PASS',exactApplicationLabels:[60,90,120],actualTransactions:[939,941,942],durationCardsInViewport:true,duplicateExecutionPanels:0});await page.close();
          }}finally{await browser.close();}
          await writeFile(out+'/report.json',JSON.stringify({status:'SCOPED_PASS',captureSource:'LIVE_PRODUCTION',views,previousEightLocaleJourneys:'PRESERVED_40420807027',externalModel:'NOT_TESTED',protectedAccounts:'NOT_TESTED',humanReferenceAcceptance:'NOT_DECLARED'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: icp-exact-labels-live, path: diagnostics/icp-exact-labels-live}
      - name: Retain successful live evidence
        run: |
          git config user.name "HossamBahr Production Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          git add diagnostics/icp-exact-labels-live
          git commit -m "Retain exact ICP choice labels and visible duration cards [skip ci]"
          git pull --rebase --autostash origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
