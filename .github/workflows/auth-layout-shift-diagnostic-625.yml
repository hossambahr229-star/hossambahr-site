name: Diagnose Arabic mobile sign-in layout shifts
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/auth-layout-shift-diagnostic-625.yml, diagnostics/auth-layout-shift-diagnostic-625.mjs]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Attribute layout shifts on actual public sign-in
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node diagnostics/auth-layout-shift-diagnostic-625.mjs
      - name: Preserve diagnostic evidence
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/auth-layout-shift-diagnostic-625/report.json
          git commit -m "Record Arabic mobile sign-in layout shift sources"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
