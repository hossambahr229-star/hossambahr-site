name: Prepare Latest Full Frame Review
on:
  push:
    branches: [agent/review-latest-full-frame]
    paths: [scripts/review-latest-full-frame.mjs, .github/workflows/review-latest-full-frame.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --no-package-lock sharp@0.35.4
      - run: node scripts/review-latest-full-frame.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-latest-full-frame
          path: artifacts/review-latest-full-frame
      - name: Preserve live evidence
        if: always()
        run: |
          git config user.name "HossamBahr Production Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          git fetch origin agent/review-latest-full-frame
          git reset --mixed origin/agent/review-latest-full-frame
          git add artifacts/review-latest-full-frame
          if ! git diff --cached --quiet; then
            git commit -m "Record actual full frame viewing copies [skip ci]"
            git push origin HEAD:agent/review-latest-full-frame
          fi
