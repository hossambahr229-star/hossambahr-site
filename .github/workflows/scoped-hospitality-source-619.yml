name: Scoped hospitality source browser acceptance 619
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/scoped-hospitality-source-619.yml, diagnostics/scoped-hospitality-browser-619.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install pinned browser runtime and Firefox
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Prepare exact proposed source
        run: |
          git fetch origin agent/scoped-hospitality-guidance-20261105
          git worktree add /tmp/hb-scoped-source 9bb8b40bdeba144ed4e25d3cd00890ec849c2eaf
          cd /tmp/hb-scoped-source
          npm run build
      - name: Verify scoped facts, disclosures and both pathways
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          HB_SOURCE_SHA: 9bb8b40bdeba144ed4e25d3cd00890ec849c2eaf
        run: node diagnostics/scoped-hospitality-browser-619.mjs
      - name: Preserve actual source browser evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          if [ ! -d diagnostics/scoped-hospitality-source-619 ]; then exit 0; fi
          git add diagnostics/scoped-hospitality-source-619
          if ! git diff --cached --quiet; then
            git commit -m "Record scoped hospitality source browser pathways and fee isolation"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
