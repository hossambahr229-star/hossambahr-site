name: Ajman Issuance Facts Acceptance
on:
  push:
    branches: [agent/ajman-issuance-facts]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm run build
      - run: node --test test/architecture/ajman-issuance-reviewed-fields.test.mjs test/architecture/partial-service-checklist.test.mjs
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/ajman-issuance-facts-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ajman-issuance-facts-preview
          path: |
            diagnostics/ajman-issuance-facts
      - name: Retain review evidence
        if: always()
        run: |
          git config user.name "HossamBahr Preview Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          if [ ! -d diagnostics/ajman-issuance-facts ]; then exit 0; fi
          git add diagnostics/ajman-issuance-facts
          if ! git diff --cached --quiet; then
            git commit -m "Record service section navigation evidence [skip ci]"
            git pull --rebase --autostash origin agent/ajman-issuance-facts
            git push origin HEAD:agent/ajman-issuance-facts
          fi
