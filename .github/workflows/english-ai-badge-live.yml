name: Live AI context badge localization
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/english-ai-badge-live.mjs','.github/workflows/english-ai-badge-live.yml']
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/english-ai-badge-live.mjs
      - name: Preserve real conversation evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/english-ai-badge-live-2026-10-19
          git diff --cached --quiet || git commit -m "Record live AI badge localization [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-ai-context-badge
          path: diagnostics/english-ai-badge-live-2026-10-19
