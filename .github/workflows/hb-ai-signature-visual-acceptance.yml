name: HB AI Signature Visual Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'public-ai-concierge.js'
      - 'global-os.css'
      - 'premium-platform.css'
      - 'premium-platform.js'
      - 'index.html'
      - 'supabase/functions/public-ai-concierge/**'
      - 'supabase/functions/document-ai/**'
      - '.github/workflows/hb-ai-signature-visual-acceptance.yml'
  workflow_dispatch:
jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Capture and verify live HB AI signature experience
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hb-ai-visual
          cat > hb-ai-visual.mjs <<'JS'
          import { chromium } from 'playwright';
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:execFileSync('which',['chrome'],{encoding:'utf8'}).trim()});
          const sizes=[['desktop-1440',1440,1000],['laptop-1366',1366,900],['mobile-390',390,844],['mobile-430',430,932]];
          const results=[];
          for(const [name,width,height] of sizes){
            const page=await browser.newPage({viewport:{width,height},colorScheme:'light'});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://hossambahr.com/?hb-ai-visual='+name,{waitUntil:'networkidle'});
            const tile=page.locator('[data-premium-ai-toggle]');
            const tileVisible=await tile.isVisible();
            const tileBg=await tile.evaluate(el=>getComputedStyle(el).backgroundColor);
            await tile.click();
            const panel=page.locator('#premium-ai-panel');
            await panel.waitFor({state:'visible'});
            const bodyBg=await page.locator('body').evaluate(el=>getComputedStyle(el).backgroundImage+' '+getComputedStyle(el).backgroundColor);
            const mark=panel.locator('.premium-hb-mark').first();
            const composer=panel.locator('#government-search');
            const first={mark:await mark.isVisible(),composer:await composer.isVisible(),title:await page.locator('h1').textContent(),tagline:await panel.locator('.premium-ai-head small').textContent(),quick:await panel.locator('.examples button').allTextContents(),bodyBg,panelVisible:await panel.isVisible()};
            await page.screenshot({path:'hb-ai-visual/'+name+'-landing.png',fullPage:false});
            await composer.fill('أريد أجدد إقامة زوجتي في دبي');
            await composer.press('Enter');
            await page.waitForSelector('.hb-chat-thinking',{state:'visible',timeout:2500}).catch(()=>{});
            const thinkingSeen=await page.locator('.hb-chat-thinking').count()>0;
            await page.waitForSelector('.hb-chat-answer',{timeout:20000});
            await page.locator('.hb-chat-disclosure').first().click().catch(()=>{});
            await page.locator('.hb-chat-source').first().click().catch(()=>{});
            const answer={answer:await page.locator('.hb-chat-answer').isVisible(),verified:await page.getByText('مستند إلى مصدر رسمي',{exact:false}).count(),source:await page.locator('.hb-chat-source').count(),transaction:await page.getByText('ابدأ معاملتي',{exact:true}).count(),overflow:await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth)};
            await page.screenshot({path:'hb-ai-visual/'+name+'-conversation.png',fullPage:false});
            const input=page.locator('#hb-ai-document-input'); await input.setInputFiles({name:'visual-qa.txt',mimeType:'text/plain',buffer:Buffer.from('طلب تجديد إقامة تجريبي بدون بيانات شخصية')});
            const attachment=await page.locator('.hb-ai-attachment-card').isVisible();
            results.push({name,tileVisible,tileBg,first,thinkingSeen,answer,attachment,errors});
            await page.close();
          }
          fs.writeFileSync('hb-ai-visual/result.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          const fail=results.some(r=>!r.tileVisible||!r.first.panelVisible||!r.first.mark||!r.first.composer||!r.first.bodyBg.includes('rgb(255, 255, 255)')&&r.first.bodyBg.includes('rgb(17, 17, 17)')||r.first.quick.length!==4||!r.answer.answer||!r.answer.verified||!r.answer.source||!r.answer.transaction||r.answer.overflow||!r.attachment||r.errors.length);
          await browser.close(); if(fail)process.exit(1);
          JS
          node hb-ai-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hb-ai-signature-visual-acceptance
          path: hb-ai-visual
          retention-days: 14
