name: Global OS Edge Typecheck
on:
  push:
    branches:
      - fix/global-os-edge-runtime-typecheck-20260930
permissions:
  contents: read
jobs:
  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - run: deno check supabase/functions/global-os-api/index.ts
      - run: deno check --config supabase/functions/global-os-worker/deno.json supabase/functions/global-os-worker/index.ts
