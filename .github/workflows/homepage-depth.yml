name: Homepage Service Depth and Correct Destinations
on:
  pull_request:
    paths: ['src/publication/**','transaction-discovery.*','premium-platform.js','scripts/homepage-depth-browser.mjs','.github/workflows/homepage-depth.yml']
  push:
    branches: [main]
    paths: ['src/publication/**','transaction-discovery.*','premium-platform.js','scripts/homepage-depth-browser.mjs','.github/workflows/homepage-depth.yml']
permissions: {contents: read}
jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock playwright@1.55.0 sharp@0.35.4
      - run: npm run build
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/homepage-depth-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: homepage-depth-preview, path: artifacts/homepage-depth}
  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npm run build
      - name: Wait for coherent bilingual homepage runtime publication
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const files=['transaction-discovery.js','transaction-discovery.css','service-capabilities.js','activity-discovery.js','business-activities-discovery.js'];
          const expected=await Promise.all(files.map(file=>readFile(file,'utf8'))),hash=createHash('sha256');
          for(const text of expected)hash.update(text);const version=hash.digest('hex').slice(0,12);
          const expectedHome=await readFile('index.html','utf8'),requiresCommon=expectedHome.includes('id="home-common-transactions"');
          const base='https://hossambahr.com',get=async path=>{const response=await fetch(base+path,{cache:'no-store'});return response.ok?response.text():'';};
          for(let i=0;i<60;i++){
            const [ar,en,...live]=await Promise.all(['/','/en/',...files.map(file=>'/'+file)].map(get));
            const ready=live.every((text,index)=>text===expected[index])&&[ar,en].every(html=>html.includes('data-home-discovery="task-shortcuts"')&&html.includes('/transaction-discovery.js?v='+version)&&html.includes('/transaction-discovery.css?v='+version)&&(!requiresCommon||html.includes('id="home-common-transactions"')));
            if(ready)process.exit(0);await new Promise(resolve=>setTimeout(resolve,20000));
          }throw Error('Current bilingual homepage HTML and runtime assets are not coherently published');
          NODE
      - run: HB_BASE_URL=https://hossambahr.com HB_BROWSER_PATH="$(which chrome)" node scripts/homepage-depth-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: homepage-depth-live, path: artifacts/homepage-depth}
