name: Official source panel contrast
on:
  push:
    branches: [agent/official-source-contrast]
permissions: {contents: read}
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm run build
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: HB_PREVIEW_CSS=1 HB_BROWSER_PATH="$(which chrome)" node scripts/official-source-contrast.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: official-source-contrast-preview, path: diagnostics/official-source-contrast-preview}
