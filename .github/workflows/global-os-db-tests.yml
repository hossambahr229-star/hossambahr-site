name: Global OS Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/global-os-db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database from migrations
        run: supabase db reset
      - name: Lint PostgreSQL functions and schema
        run: supabase db lint --level error
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
