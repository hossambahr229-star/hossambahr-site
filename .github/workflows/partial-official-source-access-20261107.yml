name: Recheck all partial catalog source destinations
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/partial-official-source-access-20261107.yml, diagnostics/partial-official-source-access-20261107.mjs]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node diagnostics/partial-official-source-access-20261107.mjs
      - name: Preserve official endpoint observations
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/partial-official-source-access-20261107
          git commit -m "Record official source access for all partial services"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
