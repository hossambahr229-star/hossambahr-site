name: Verify complete navigation repairs on actual Production 644
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/public-navigation-live-644.yml]
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: f2a6afca9ebd4a0420df408697dde2570c099bf0, path: site}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0 cheerio@1.1.2
      - run: cd site && npm run build
      - name: Wait for exact affected Production HTML and runtimes
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const files=['services/index.html','en/services/index.html','auth/index.html','en/auth/index.html','en/account/index.html','auth-client.js','zero-defect-routing.js'],hash=x=>createHash('sha256').update(x instanceof ArrayBuffer?Buffer.from(x):x).digest('hex'),expected=await Promise.all(files.map(f=>readFile('site/'+f)));
          for(let attempt=0;attempt<60;attempt++){let ready=true;for(let i=0;i<files.length;i++){try{const path='/'+files[i].replace(/index\.html$/,'');const response=await fetch('https://hossambahr.com'+path+'?navigation644=f2a6afca9ebd4a0420df408697dde2570c099bf0&attempt='+attempt,{signal:AbortSignal.timeout(30000),headers:{'cache-control':'no-cache'}});if(!response.ok||hash(await response.arrayBuffer())!==hash(expected[i]))ready=false;}catch{ready=false;}}if(ready){console.log('Exact affected bilingual HTML and both runtimes reached Production');process.exit(0);}await new Promise(r=>setTimeout(r,15000));}throw Error('Navigation repairs are not coherently published');
          NODE
      - name: Verify actual directory and account controls
        run: cd site && HB_BASE_URL=https://hossambahr.com HB_BROWSER_PATH="${{ steps.chrome.outputs.chrome-path }}" node scripts/directory-navigation-browser.mjs
      - name: Recheck every public route and all internal fragments
        run: SOURCE_SHA=f2a6afca9ebd4a0420df408697dde2570c099bf0 node diagnostics/platform-link-audit-after-644.mjs
      - name: Preserve actual Production evidence
        if: always()
        run: |
          mkdir -p diagnostics/public-navigation-live-644
          cp site/artifacts/public-navigation/* diagnostics/public-navigation-live-644/ || true
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const file='diagnostics/public-navigation-live-644/report.json';try{const r=JSON.parse(await readFile(file,'utf8'));r.sourceMerge='f2a6afca9ebd4a0420df408697dde2570c099bf0';await writeFile(file,JSON.stringify(r,null,2));}catch{}
          NODE
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/public-navigation-live-644 diagnostics/platform-link-audit-after-644
          git diff --cached --quiet && exit 0
          git commit -m "Record real full-platform links and targeted navigation acceptance for f2a6afca9ebd4a0420df408697dde2570c099bf0"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
