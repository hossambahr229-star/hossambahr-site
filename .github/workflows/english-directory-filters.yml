name: English Directory Filter Acceptance
on:
  push:
    branches: [agent/english-directory-filters, agent/mobile-directory-disclosure]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm run build
      - run: node --test test/architecture/english-directory-filters.test.mjs
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/english-directory-filters-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-directory-filters-preview
          path: |
            diagnostics/english-directory-filters
      - name: Retain review evidence
        if: always()
        run: |
          git config user.name "HossamBahr Preview Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          if [ ! -d diagnostics/english-directory-filters ]; then exit 0; fi
          git add diagnostics/english-directory-filters
          if ! git diff --cached --quiet; then
            git commit -m "Record English filter acceptance evidence [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
