name: Guidance usability Production acceptance
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/guidance-usability-610.yml]
permissions: {contents: write}
jobs:
  provider-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Check current external model once without accepting fallback as success
        run: |
          node --input-type=module <<'JS'
          import fs from'node:fs/promises';const out='diagnostics/guidance-usability-610';await fs.mkdir(out,{recursive:true});const q='عايز أجيب مراتي دبي ومش عارف أبدأ منين';let report;try{const response=await fetch('https://ngcrkuykfqmiqhsnpcrc.supabase.co/functions/v1/public-ai-concierge',{method:'POST',headers:{'Content-Type':'application/json',Origin:'https://hossambahr.com'},body:JSON.stringify({goal:q,latest_turn:q,locale:'ar',history:[],context:{},stream:false}),signal:AbortSignal.timeout(90000)});const payload=await response.json(),e=payload.result?.engine||{};report={checkedAt:new Date().toISOString(),attempts:1,httpStatus:response.status,external_model_used:e.external_model_used===true,engine:e,service:payload.result?.matches?.[0]?.service_slug||null,errorCode:payload.code||payload.error||null,acceptance:'STATUS_ONLY_NOT_MODEL_QUALITY_ACCEPTANCE'};}catch(e){report={checkedAt:new Date().toISOString(),attempts:1,status:'TOOL_OR_NETWORK_ERROR',error:String(e),acceptance:'NOT_ACCEPTED'};}await fs.writeFile(out+'/provider-status.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@v4
        with: {name: current-provider-status-610, path: diagnostics/guidance-usability-610/provider-status.json}
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Wait for updated guidance and cache-safe runtime
        run: |
          node --input-type=module <<'JS'
          const expectedVersion='global-os-20261104a';for(let i=0;i<90;i++){const html=await(await fetch('https://hossambahr.com/services/'+encodeURIComponent('إصدار-إقامة-لمولود-جديد-في-دبي')+'/',{cache:'no-store'})).text(),runtime=await(await fetch('https://hossambahr.com/global-os-client.js?v='+expectedVersion,{cache:'no-store'})).text(),css=await(await fetch('https://hossambahr.com/intent-first.css',{cache:'no-store'})).text();if(html.includes(expectedVersion)&&html.includes('الخطوة التالية')&&!html.includes('المستندات والمتطلبات')&&runtime.includes('main?.dataset.publicationState === "NORMALIZED"')&&css.includes('main[data-publication-state="NORMALIZED"] .page-hero h1'))process.exit(0);await new Promise(r=>setTimeout(r,10000));}throw Error('Updated guidance and versioned runtime not yet live');
          JS
      - name: Verify six guidance views and four canonical service canaries
        run: |
          node --input-type=module <<'JS'
          import{chromium}from'playwright';import fs from'node:fs/promises';import assert from'node:assert/strict';const out='diagnostics/guidance-usability-610';await fs.mkdir(out,{recursive:true});const normalized=[['خدمات-نافس-للمنشآت','https://nafis.gov.ae/employer'],['ضمان-أو-تأمين-العامل','https://hossambahr.com/authorities/mohre/'],['إصدار-إقامة-لمولود-جديد-في-دبي','https://hossambahr.com/services/family-residency-uae/']];const report={status:'RUNNING',source:'REAL_PRODUCTION_BROWSER',guidance:[],canonical:[],errors:[]},browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});for(const width of[1440,390]){const page=await browser.newPage({viewport:{width,height:width===390?844:960}});for(const[slug,href]of normalized){try{await page.goto('https://hossambahr.com/services/'+encodeURIComponent(slug)+'/',{waitUntil:'networkidle'});assert.equal(await page.locator('main').getAttribute('data-publication-state'),'NORMALIZED');assert.equal(await page.locator('[data-start-case]').count(),0);assert.equal(await page.locator('.service-facts-bar,.service-decision-nav').count(),0);const anchor=page.locator('a#official-route.normalized-link');assert.equal(await anchor.count(),1);assert.equal(new URL(await anchor.getAttribute('href'),page.url()).href,href);const state=await page.locator('main h1').evaluate(e=>({fontSize:parseFloat(getComputedStyle(e).fontSize),overflow:document.documentElement.scrollWidth>innerWidth+1}));assert.ok(state.fontSize<=40);assert.equal(state.overflow,false);const text=await page.locator('main').innerText();assert.doesNotMatch(text,/The retained source|not the MOHRE service catalogue|غير موثق بعد/);if(slug.includes('لمولود'))assert.equal(await page.locator('main .detail-section ul:empty').count(),0);report.guidance.push({slug,width,status:'PASS',...state,nextAction:href});await page.screenshot({path:out+'/guidance-'+normalized.findIndex(s=>s[0]===slug)+'-'+width+'.png'});}catch(e){report.errors.push({slug,width,error:String(e.stack||e)});}}for(const slug of['family-residency-uae','issuance-of-a-new-work-permit-golden-visa-holders']){try{await page.goto('https://hossambahr.com/services/'+slug+'/',{waitUntil:'networkidle'});await page.locator('[data-start-case]').waitFor({state:'visible',timeout:20000});assert.ok(await page.locator('.hb-service-pathways .hb-path-official').count()>=1);const wa=await page.locator('.hb-service-pathways .hb-path-assisted').first().getAttribute('href');assert.equal(new URL(wa).pathname,'/971503780460');assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1),false);report.canonical.push({slug,width,status:'PASS',protectedActionExecuted:false});}catch(e){report.errors.push({slug,width,error:String(e.stack||e)});}}await page.close();}await browser.close();report.status=report.errors.length?'FAIL':'PASS';await fs.writeFile(out+'/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));assert.equal(report.status,'PASS');
          JS
      - name: Preserve actual Production acceptance
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/guidance-usability-610
          git commit -m "Preserve real guidance usability and canonical transaction acceptance"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
