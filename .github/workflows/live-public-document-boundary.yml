name: Public document authentication boundary
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/live-public-document-boundary.mjs','.github/workflows/live-public-document-boundary.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: HB_BROWSER_PATH="$(which chrome)" HB_BASE_URL=https://hossambahr.com HB_OUTPUT_DIR=diagnostics/public-document-auth-boundary-2026-10-21 node scripts/live-public-document-boundary.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/public-document-auth-boundary-2026-10-21
          git diff --cached --quiet || git commit -m "Record live described activity and contact context [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: public-document-auth-boundary, path: diagnostics/public-document-auth-boundary-2026-10-21}
