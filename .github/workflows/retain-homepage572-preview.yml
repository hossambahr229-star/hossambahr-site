name: Retain Homepage572 Preview
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['.github/workflows/retain-homepage572-preview.yml']
permissions: {contents: write, actions: read}
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh run download 40318272621 --name homepage-depth-preview --dir diagnostics/homepage572-approved-preview
          git config user.name "HossamBahr Production Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          git add diagnostics/homepage572-approved-preview
          git commit -m "Retain successful homepage and navigation preview evidence [skip ci]"
          git pull --rebase --autostash origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
