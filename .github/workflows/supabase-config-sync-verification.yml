name: Supabase Config Sync Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-config-sync-verification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ngcrkuykfqmiqhsnpcrc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Push versioned config
        run: supabase config push
      - name: Record successful config sync
        shell: bash
        run: |
          mkdir -p diagnostics
          cat > diagnostics/supabase-config-sync.json <<EOF
          {
            "project_ref": "ngcrkuykfqmiqhsnpcrc",
            "config_push": "success",
            "site_url_expected": "https://hossambahr.com",
            "commit": "${GITHUB_SHA}"
          }
          EOF
          git config user.name "HossamBahr Supabase Config"
          git config user.email "supabase-config@users.noreply.github.com"
          git add diagnostics/supabase-config-sync.json
          git commit -m "Record successful Supabase config sync [skip ci]"
          git push origin HEAD:main
