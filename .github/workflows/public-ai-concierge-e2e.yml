name: Public AI Concierge E2E
on:
  push:
    branches:
      - feat/public-ai-concierge-20260930
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Anonymous public AI funnel
        env:
          HB_BROWSER_PATH: /usr/bin/google-chrome
        run: node tmp-public-ai-e2e.mjs
      - name: Responsive layout
        env:
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_LAYOUT_CONCURRENCY: 6
        run: node visual-layout-audit.mjs
