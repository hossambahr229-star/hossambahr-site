name: Food activity scope and precision
on:
  push:
    branches: [agent/food-activity-scope]
    paths-ignore: ['artifacts/**']
permissions: {contents: write}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npm run build
      - run: node scripts/food-activity-scope.test.mjs
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/food-activity-scope-browser.mjs
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/capability-discovery-browser.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add artifacts/food-activity-scope artifacts/capability-discovery
          git diff --cached --quiet || git commit -m "Preserve scoped food activity preview [skip ci]"
          git push origin HEAD:agent/food-activity-scope
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: food-activity-scope, path: artifacts/food-activity-scope}
