name: Live RERA choices and Fujairah browser
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/live-rera-choices.mjs','.github/workflows/live-rera-choices.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: node scripts/wait-rera-choices.mjs
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/live-rera-choices.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/rera-choices-production-2026-10-20
          git diff --cached --quiet || git commit -m "Record real RERA choices and Fujairah UI [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rera-choices-production, path: diagnostics/rera-choices-production-2026-10-20}
