name: Diagnose actual SEDD assistant selection
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/diagnose-sedd-ai.mjs','.github/workflows/diagnose-sedd-ai.yml']
permissions: {contents: write}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node scripts/diagnose-sedd-ai.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/sedd-ai-diagnostic-2026-10-20
          git diff --cached --quiet || git commit -m "Capture SEDD assistant selection without accepting it [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: sedd-ai-diagnostic, path: diagnostics/sedd-ai-diagnostic-2026-10-20}
