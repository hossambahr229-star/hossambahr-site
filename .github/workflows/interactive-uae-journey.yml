name: Interactive UAE Journey Check
on:
  push:
    branches:
      - feat/interactive-compact-uae-journey-20260930
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Interactive journey checks
        env:
          HB_BROWSER_PATH: /usr/bin/google-chrome
        run: node tmp-interactive-journey-check.mjs
      - name: Full responsive layout audit
        env:
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_LAYOUT_CONCURRENCY: 6
        run: node visual-layout-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interactive-uae-journey
          path: |
            artifacts/interactive-journey
            visual-layout-audit
