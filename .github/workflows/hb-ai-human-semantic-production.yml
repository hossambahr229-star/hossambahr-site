name: HB AI human semantic production
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/public-ai-concierge/**"
      - "public-ai-concierge.js"
      - "scripts/hb-ai-human-semantic-production.mjs"
      - ".github/workflows/hb-ai-human-semantic-production.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hb-ai-live-provider-verification
  cancel-in-progress: false
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -o pipefail
          node scripts/hb-ai-human-semantic-production.mjs | tee semantic-production-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-production-result
          path: semantic-production-result.json
