name: Repository Secret Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Detect committed secrets and private-file patterns
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run existing repository secret audit
        run: node src/global/security/audit-secrets.mjs
      - name: Reject accidentally tracked private credentials and databases
        shell: python
        run: |
          import subprocess
          from pathlib import PurePosixPath

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split(chr(0))
          forbidden = []
          forbidden_suffixes = (".pem", ".p12", ".pfx", ".key", ".sqlite", ".sqlite3", ".db", ".dump")
          for item in filter(None, paths):
              p = PurePosixPath(item)
              lower = p.name.lower()
              if (
                  (lower.startswith(".env") and lower not in (".env.example", ".env.sample"))
                  or lower in ("id_rsa", "id_ed25519", "credentials.json", "service-account.json")
                  or lower.endswith(forbidden_suffixes)
              ):
                  forbidden.append(item)
          if forbidden:
              print("ERROR: sensitive-looking tracked paths detected:")
              for path in sorted(forbidden):
                  print(" -", path)
              raise SystemExit(1)
          print("PASS: no disallowed private-file paths are tracked.")

# This guard detects accidental exposure; it cannot make an existing public
# repository private or remove copies already obtained by third parties.
