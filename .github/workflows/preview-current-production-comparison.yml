name: Preview current production comparison
on:
  push:
    branches: [agent/preview-current-production-comparison]
    paths: [.github/workflows/preview-current-production-comparison.yml]
permissions: {contents: write}
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --no-package-lock --ignore-scripts sharp@0.35.4
      - run: |
          node --input-type=module <<'JS'
          import sharp from 'sharp';
          import {mkdir} from 'node:fs/promises';
          await mkdir('artifacts/production-comparison-preview',{recursive:true});
          for(const [name,source] of [['actual','viewport-1440'],['overlay','overlay-50'],['diff','image-diff'],['reference','reference-1440']])await sharp('artifacts/production-reference/'+source+'.png').jpeg({quality:88}).toFile('artifacts/production-comparison-preview/'+name+'.jpg');
          JS
      - run: |
          git config user.name "HossamBahr Acceptance"
          git config user.email "acceptance@users.noreply.github.com"
          git add artifacts/production-comparison-preview
          git commit -m "Record compact previews of existing actual comparison [skip ci]"
          git push origin HEAD:agent/preview-current-production-comparison
