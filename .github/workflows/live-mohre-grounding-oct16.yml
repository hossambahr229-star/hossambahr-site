name: Live MOHRE Grounding and Fields
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Targeted live acceptance scope
        type: choice
        default: all
        options: [all, pages, ai, domestic_en]
  push:
    branches: [agent/live-mohre-grounding-oct16]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npm run build
      - run: node scripts/live-mohre-grounding-oct16.mjs
        env:
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_MOHRE_AI_ONLY: ${{ (github.event_name == 'push' || inputs.scope == 'ai' || inputs.scope == 'domestic_en') && '1' || '' }}
          HB_MOHRE_PAGES_ONLY: ${{ inputs.scope == 'pages' && '1' || '' }}
          HB_MOHRE_DOMESTIC_EN_ONLY: ${{ (github.event_name == 'push' || inputs.scope == 'domestic_en') && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-mohre-grounding-oct16
          path: artifacts/live-mohre-oct16
