name: Initial sign-in notice source acceptance 627
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/auth-initial-notice-source-627.yml, diagnostics/auth-initial-notice-browser-627.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install pinned browser runtime and Firefox
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Prepare exact proposed source
        run: |
          git fetch origin agent/auth-initial-trustbar-20261106
          git worktree add /tmp/hb-auth-initial-notice-source 24b311f0bcbe1f733af623b2ea87892a0c982288
          cd /tmp/hb-auth-initial-notice-source
          npm run build
      - name: Verify the existing notice is present at first paint without duplicates
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          HB_SOURCE_SHA: 24b311f0bcbe1f733af623b2ea87892a0c982288
        run: node diagnostics/auth-initial-notice-browser-627.mjs
      - name: Preserve actual source browser evidence
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          if [ ! -d diagnostics/auth-initial-notice-source-627 ]; then exit 0; fi
          git add diagnostics/auth-initial-notice-source-627
          if ! git diff --cached --quiet; then
            git commit -m "Record source browser evidence for the initial sign-in notice"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
