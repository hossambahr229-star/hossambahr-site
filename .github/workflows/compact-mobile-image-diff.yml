name: Compact mobile image comparison
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/compact-mobile-image-diff.mjs']
permissions: {contents: write}
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --ignore-scripts sharp@0.35.4
      - run: node scripts/compact-mobile-image-diff.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/mobile-ai-production-2026-10-19/comparison
          git diff --cached --quiet || git commit -m "Preserve mobile Production image comparison [skip ci]"
          git push origin HEAD:agent/dld-source-review-evidence
