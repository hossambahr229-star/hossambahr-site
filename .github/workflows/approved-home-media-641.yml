name: Package verified approved homepage screenshots 641
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/approved-home-media-641.yml]
permissions: {contents: write}
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --no-save --no-package-lock sharp@0.35.4
      - run: node diagnostics/approved-home-media-641.mjs
      - run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/approved-home-release-641
          git diff --cached --quiet && exit 0
          git commit -m "Package real before/after screenshots without altering UI evidence"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
