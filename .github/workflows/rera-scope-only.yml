name: RERA assistant source regression
on:
  push:
    branches: [agent/rera-approval-scope-only]
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node scripts/rera-assistant-regression.test.mjs
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno check supabase/functions/public-ai-concierge/index.ts
