name: Capture public production visual review
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/public-visual-review-20261107.yml, diagnostics/public-visual-review-20261107.mjs]
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0 sharp@0.35.4
      - name: Capture public layouts
        env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node diagnostics/public-visual-review-20261107.mjs
      - name: Preserve visual review sheets
        if: always()
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/public-visual-review-20261107
          if ! git diff --cached --quiet; then
            git commit -m "Record public production visual review"
            git pull --rebase origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
