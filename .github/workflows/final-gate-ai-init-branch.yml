name: Final Gate AI Init Branch
on:
  push:
    branches:
      - fix/final-gate-ai-init-race-20260930
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:architecture
      - name: Conversation acceptance after explicit AI init
        env:
          HB_NODE_MODULES: ${{ github.workspace }}/node_modules
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_OUTPUT_DIR: artifacts/final-gate-ai-init
        run: npm run test:final-platform
