name: Executive remaining visual diagnosis
on:
  push:
    branches: [agent/executive-remaining-20261124]
    paths-ignore: ['artifacts/**']
permissions: {contents: write}
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0
      - run: node scripts/executive-remaining-visual.mjs
        env: {HB_BROWSER_PATH: /usr/bin/google-chrome}
      - name: Preserve real diagnosis
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add artifacts/executive-remaining
          git diff --cached --quiet || git commit -m "Record real assistant and tablet visibility [skip ci]"
          git push origin HEAD:agent/executive-remaining-20261124
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: executive-remaining, path: artifacts/executive-remaining}
