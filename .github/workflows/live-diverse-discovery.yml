name: Diverse public discovery journeys
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/live-diverse-discovery.mjs','.github/workflows/live-diverse-discovery.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/live-diverse-discovery.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/diverse-discovery-production-2026-10-19
          git diff --cached --quiet || git commit -m "Preserve diverse public discovery evidence [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: diverse-public-discovery, path: diagnostics/diverse-discovery-production-2026-10-19}
