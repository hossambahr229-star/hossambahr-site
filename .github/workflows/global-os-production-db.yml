name: Global OS Production Database Deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-os-production-database
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: bbddlpvxjowphkagvycz
    steps:
      - uses: actions/checkout@v4
      - name: Validate encrypted deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Supabase production deployment secrets are not configured."
            exit 1
          fi
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Show migration plan
        run: supabase migration list
      - name: Apply reviewed migrations
        run: supabase db push
      - name: Deploy Global OS Edge API
        run: supabase functions deploy global-os-api --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify migration state
        run: supabase migration list
