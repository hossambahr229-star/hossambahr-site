name: Global OS Production Database Deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - ".github/workflows/global-os-production-db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-os-production-database
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ngcrkuykfqmiqhsnpcrc
    steps:
      - uses: actions/checkout@v4
      - name: Detect encrypted deployment credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Supabase production credentials are available."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase production deployment DEFERRED: encrypted CLI credentials are not configured. This workflow did not deploy database migrations or Edge Functions."
            echo "### Supabase production deployment: DEFERRED — NOT DEPLOYED BY THIS RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "Database/Edge deployment must be performed through the authorized Supabase connector or by adding encrypted CLI credentials before this workflow can deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure production Auth URLs
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{
              "site_url": "https://hossambahr.com",
              "uri_allow_list": "https://hossambahr.com/auth/callback/**,https://hossambahr.com/auth/reset/**",
              "external_email_enabled": true,
              "disable_signup": false
            }'
      - name: Setup Supabase CLI
        if: steps.credentials.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        if: steps.credentials.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Push versioned Supabase project config
        if: steps.credentials.outputs.ready == 'true'
        run: supabase config push
      - name: Show migration plan
        if: steps.credentials.outputs.ready == 'true'
        run: supabase migration list
      - name: Apply reviewed migrations
        if: steps.credentials.outputs.ready == 'true'
        run: supabase db push
      - name: Deploy Global OS Edge API
        if: steps.credentials.outputs.ready == 'true'
        run: supabase functions deploy global-os-api --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy Global OS worker
        if: steps.credentials.outputs.ready == 'true'
        run: supabase functions deploy global-os-worker --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy first-party web analytics
        if: steps.credentials.outputs.ready == 'true'
        run: supabase functions deploy web-analytics --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Record deferred production deployment
        if: steps.credentials.outputs.ready != 'true'
        run: |
          echo "PRODUCTION_DEPLOYMENT=DEFERRED"
          echo "MIGRATIONS_DEPLOYED=false"
          echo "EDGE_FUNCTIONS_DEPLOYED=false"
      - name: Verify migration state
        if: steps.credentials.outputs.ready == 'true'
        run: supabase migration list
