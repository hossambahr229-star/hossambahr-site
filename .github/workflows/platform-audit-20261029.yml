name: Current platform audit evidence
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/platform-audit-20261029.yml]
permissions: {contents: write, actions: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '89945aeabad1f2a0d856eb7ff9008771500f8140'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Check every current source HTML link and catalog completeness
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';import path from 'node:path';
          const out='diagnostics/platform-audit-20261029';await fs.mkdir(out,{recursive:true});let files=[];async function walk(dir='.') {for(const e of await fs.readdir(dir,{withFileTypes:true})){if(['.git','node_modules','diagnostics','artifacts','zero-defect-smoke'].includes(e.name))continue;const p=path.join(dir,e.name);if(e.isDirectory())await walk(p);else if(p.endsWith('.html'))files.push(p.replaceAll('\\','/'));}}await walk();const report={source:'CURRENT_MAIN_STATIC_SOURCE_NOT_LIVE_CLICK_ACCEPTANCE',pages:files.length,emptyLinks:[],missingDestinations:[],missingLocalFragments:[],englishLanguageLeaks:[],missingH1:[],formsWithoutLabels:[],catalog:null};const available=new Set(files),cache=new Map();for(const file of files)cache.set(file,await fs.readFile(file,'utf8'));
          for(const[file,html]of cache){if(!/<h1[\s>]/i.test(html))report.missingH1.push(file);const current='https://hossambahr.com/'+(file==='index.html'?'':file.replace(/index[.]html$/,''));for(const match of html.matchAll(/<a\b([^>]*)>([\s\S]*?)<\/a>/gi)){const attributes=match[1],href=attributes.match(/\bhref\s*=\s*["']([^"']*)["']/i)?.[1];if(href===undefined)continue;const text=match[2].replace(/<[^>]*>/g,'').trim();if(!href||href==='#'||/^javascript:/i.test(href)){report.emptyLinks.push({file,href,text:text.slice(0,80)});continue;}let u;try{u=new URL(href.replaceAll('&amp;','&'),current);}catch{continue;}if(u.hostname!=='hossambahr.com')continue;let decoded;try{decoded=decodeURIComponent(u.pathname);}catch{continue;}let target=decoded.replace(/^\//,'');if(!path.extname(target))target=target.replace(/\/?$/,'/')+'index.html';if(target==='/index.html')target='index.html';if(!available.has(target)){if(!path.extname(decoded)||/\.html$/.test(decoded))report.missingDestinations.push({file,href,text:text.slice(0,80)});continue;}if(u.hash&& !cache.get(target).includes('id="'+decodeURIComponent(u.hash.slice(1))+'"')&&!cache.get(target).includes("id='"+decodeURIComponent(u.hash.slice(1))+"'"))report.missingLocalFragments.push({file,href,text:text.slice(0,80),classification:'REQUIRES_RUNTIME_CHECK'});if(file.startsWith('en/')&&!decoded.startsWith('/en/')&&decoded!=='/'&&!/lang=["']ar|hreflang=["']ar|العربية/.test(attributes+' '+text))report.englishLanguageLeaks.push({file,href,text:text.slice(0,80),classification:'REQUIRES_RUNTIME_CHECK'});}}
          const registry=JSON.parse(await fs.readFile('src/registry/published-services.json','utf8'));report.catalog={services:registry.services.length,partial:registry.services.filter(s=>!s.verification.detailsVerified).map(s=>({slug:s.slug,verification:s.verification}))};const counts=Object.fromEntries(Object.entries(report).filter(([k,v])=>Array.isArray(v)).map(([k,v])=>[k,v.length]));report.counts=counts;await fs.writeFile(out+'/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify({source:report.source,pages:report.pages,counts,catalog:{services:report.catalog.services,partial:report.catalog.partial.length},samples:Object.fromEntries(['emptyLinks','missingDestinations','missingLocalFragments','englishLanguageLeaks'].map(k=>[k,report[k].slice(0,12)]))},null,2));
          
          JS
      - uses: actions/download-artifact@v4
        with:
          name: production-browser-verification
          run-id: 40915287602
          github-token: ${{ github.token }}
          path: diagnostics/platform-audit-20261029/browser
      - name: Preserve current audit and existing live evidence without rerunning accepted tests
        run: |
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          cp -r diagnostics/platform-audit-20261029 /tmp/hb-platform-audit-evidence
          git fetch origin agent/dld-source-review-evidence
          git checkout -B evidence origin/agent/dld-source-review-evidence
          mkdir -p diagnostics/platform-audit-20261029
          cp -r /tmp/hb-platform-audit-evidence/. diagnostics/platform-audit-20261029/
          git add diagnostics/platform-audit-20261029
          git commit -m "Preserve complete source audit and latest real Production browser evidence"
          git push origin HEAD:agent/dld-source-review-evidence
