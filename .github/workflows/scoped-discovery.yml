name: Targeted discovery intent regression
on:
  push:
    branches: [agent/scoped-rera-ajman-discovery]
    paths-ignore: ['artifacts/**']
permissions: {contents: write}
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node scripts/scoped-discovery-regression.test.mjs
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npm run build
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/scoped-discovery-browser.mjs
      - name: Preserve discovery preview
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add artifacts/scoped-discovery
          git diff --cached --quiet || git commit -m "Preserve scoped discovery preview [skip ci]"
          git push origin HEAD:agent/scoped-rera-ajman-discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: scoped-discovery, path: artifacts/scoped-discovery}
