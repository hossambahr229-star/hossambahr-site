name: Approval classification live verification
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/approval-classification-live.mjs','.github/workflows/approval-classification-live.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/approval-classification-live.mjs
      - name: Preserve live evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/approval-classification-live-2026-10-19
          git diff --cached --quiet || git commit -m "Preserve approval classification live evidence [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: approval-classification-live, path: diagnostics/approval-classification-live-2026-10-19}
