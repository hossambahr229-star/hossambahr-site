name: Verify honest ICP common conditions on Production 638
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: [.github/workflows/icp-conditions-live-638.yml, diagnostics/icp-conditions-live-638.mjs]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - env:
          HB_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node diagnostics/icp-conditions-live-638.mjs
      - name: Preserve service evidence
        if: always()
        run: |
          test -f diagnostics/icp-conditions-live-638/report.json || exit 0
          git config user.name "HossamBahr Acceptance Evidence"
          git config user.email "acceptance@users.noreply.github.com"
          git add diagnostics/icp-conditions-live-638
          git commit -m "Record live common conditions and retained uncertainty"
          git pull --rebase origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
