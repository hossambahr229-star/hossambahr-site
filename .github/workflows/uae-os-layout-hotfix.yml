name: UAE OS Layout Hotfix Check

on:
  push:
    branches:
      - fix/uae-os-hero-grid-alignment-20260930

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser runtime
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Build
        run: npm run build
      - name: Full responsive layout audit
        env:
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_LAYOUT_CONCURRENCY: 6
        run: node visual-layout-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uae-os-layout-hotfix
          path: visual-layout-audit
