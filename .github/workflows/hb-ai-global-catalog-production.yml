name: HB AI global catalog production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hb-ai-live-provider-verification
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -o pipefail
          node scripts/hb-ai-global-catalog-production.mjs | tee global-catalog-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-catalog-result
          path: global-catalog-result.json
