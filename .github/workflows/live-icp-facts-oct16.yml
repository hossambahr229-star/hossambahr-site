name: Live ICP Reviewed Facts
on:
  push:
    branches: [agent/live-icp-facts-oct16]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npm run build
      - run: node scripts/live-icp-facts-oct16.mjs
        env:
          HB_BROWSER_PATH: /usr/bin/google-chrome
          HB_ICP_REMAINING_ONLY: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-icp-facts-oct16
          path: artifacts/live-icp-facts-oct16
