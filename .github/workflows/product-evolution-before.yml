name: Product evolution before baseline
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/product-evolution-before.mjs','.github/workflows/product-evolution-before.yml']
permissions: {contents: write}
jobs:
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/product-evolution-before.mjs
      - name: Preserve actual before images
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/product-evolution-2026-10-19/before
          git diff --cached --quiet || git commit -m "Preserve actual product evolution baseline [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: product-evolution-before, path: diagnostics/product-evolution-2026-10-19/before}
