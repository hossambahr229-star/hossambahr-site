name: Mobile Navigation Bounds Acceptance
on:
  push:
    branches: [agent/mobile-menu-bounds]
    paths: ['home-geometry.css','scripts/capability-discovery-browser.mjs','.github/workflows/mobile-menu-bounds.yml']
permissions: {contents: write}
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
      - run: npm run build
      - run: HB_DISCOVERY_VIEWS_ONLY=1 HB_OUTPUT_DIR=diagnostics/mobile-menu-bounds-preview HB_BROWSER_PATH="$(which chrome)" node scripts/capability-discovery-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: mobile-menu-bounds-preview, path: diagnostics/mobile-menu-bounds-preview}
      - name: Retain focused navigation evidence
        if: always()
        run: |
          git config user.name "HossamBahr Preview Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          if [ ! -d diagnostics/mobile-menu-bounds-preview ]; then exit 0; fi
          git add diagnostics/mobile-menu-bounds-preview
          if ! git diff --cached --quiet; then
            git commit -m "Record navigation bounds preview [skip ci]"
            git pull --rebase --autostash origin agent/mobile-menu-bounds
            git push origin HEAD:agent/mobile-menu-bounds
          fi
