name: ICP common renewal conditions
on:
  push:
    branches: [agent/icp-renewal-common-conditions]
    paths-ignore: ['supabase/migrations/**']
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm run build
      - run: node --test scripts/icp-renewal-common-conditions.test.mjs
