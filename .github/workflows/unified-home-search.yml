name: Unified Homepage Search Acceptance
on:
  push:
    branches: [agent/unified-home-search]
    paths: ['src/publication/generate-transaction-discovery.mjs','scripts/unified-home-search-browser.mjs','.github/workflows/unified-home-search.yml']
permissions:
  contents: write
jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
      - run: npm run build
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/unified-home-search-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-home-search-preview
          path: diagnostics/unified-home-search-preview
      - name: Retain preview evidence
        if: always()
        run: |
          git config user.name "HossamBahr Preview Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          if [ -d diagnostics/unified-home-search-preview ]; then
            git add diagnostics/unified-home-search-preview
            if ! git diff --cached --quiet; then
              git commit -m "Record unified search preview evidence [skip ci]"
              git pull --rebase --autostash origin agent/unified-home-search
              git push origin HEAD:agent/unified-home-search
            fi
          fi
