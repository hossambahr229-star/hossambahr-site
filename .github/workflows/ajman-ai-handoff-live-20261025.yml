name: Live Exact Service To AI Bilingual Acceptance
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/ajman-ai-handoff-live-20261025.mjs','.github/workflows/ajman-ai-handoff-live-20261025.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.55.0
      - run: HB_BROWSER_PATH="$(which chrome)" node scripts/ajman-ai-handoff-live-20261025.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ajman-ai-handoff-live-20261025, path: diagnostics/ajman-ai-handoff-live-20261025}
      - name: Retain actual live evidence
        if: always()
        run: |
          git config user.name "HossamBahr Production Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          git add diagnostics/ajman-ai-handoff-live-20261025
          if ! git diff --cached --quiet; then
            git commit -m "Record actual bilingual service-to-AI handoff acceptance [skip ci]"
            git pull --rebase --autostash origin agent/dld-source-review-evidence
            git push origin HEAD:agent/dld-source-review-evidence
          fi
