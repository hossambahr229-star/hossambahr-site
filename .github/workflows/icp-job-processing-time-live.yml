name: ICP Job Reviewed Processing Time Live Acceptance
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['.github/workflows/icp-job-processing-time-live.yml']
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Wait for reviewed job processing time in Production
        run: |
          node --input-type=module <<'NODE'
          const base='https://hossambahr.com',slug="تأشيرة-استكشاف-فرص-عمل-عبر-icp-خارج-دبي";
          for(let i=0;i<60;i++){const h=await(await fetch(base+'/en/services/'+slug+'/',{cache:'no-store'})).text();if(h.includes('2 days according to all three ICP duration cards')&&h.includes('Only processing time was verified'))process.exit(0);await new Promise(r=>setTimeout(r,10000));}throw Error('Reviewed job detail not published');
          NODE
      - name: Eight real bilingual responsive service views
        run: |
          node --input-type=module <<'NODE'
          import{chromium}from'playwright';import{mkdir,writeFile}from'node:fs/promises';import assert from'node:assert/strict';
          const out='diagnostics/icp-job-processing-time-live',base='https://hossambahr.com',slug="تأشيرة-استكشاف-فرص-عمل-عبر-icp-خارج-دبي",expected={"ar":["جواز السفر.","الصورة الشخصية.","موافقة مبدئية من الجهات المعنية لتأسيس الأعمال وفق قائمة بطاقة ICP.","كشف حساب مختوم يغطي ستة أشهر على الأقل.","صورة الهوية الشخصية للمتقدمين من أفغانستان أو إيران أو العراق وفق البطاقة.","شهادة البكالوريوس أو ما يعادلها من المؤهلات العلمية وفق بطاقة ICP."],"en":["Passport.","Personal photograph.","Preliminary business-establishment approval from the relevant authorities, as listed by ICP.","Stamped bank statement covering at least six months.","Personal identification copy for applicants from Afghanistan, Iran or Iraq, as specified on the card.","Bachelor’s degree or an equivalent academic qualification, as listed by ICP."],"arTime":"يومان (2) وفق بطاقات ICP لمدد 60 و90 و120 يوماً؛ لم تحدد البطاقات أنهما يوما عمل. هذه مدة إتمام الخدمة وليست مدة البقاء.","enTime":"2 days according to all three ICP duration cards; working days are not specified. This is processing time, not the selected period of stay."};
          await mkdir(out,{recursive:true});const report={capturedAt:new Date().toISOString(),source:'LIVE_PRODUCTION',status:'RUNNING',views:[],externalModel:'NOT_TESTED',protectedAccounts:'NOT_TESTED',humanVisualAcceptance:'NOT_DECLARED'};
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});let failure;
          try{for(const width of[1440,1366,390,320])for(const locale of['ar','en']){
           const page=await browser.newPage({viewport:{width,height:width<500?844:960}});page.setDefaultTimeout(30000);const errors=[];page.on('pageerror',e=>errors.push(e.message));
           const route=(locale==='en'?'/en':'')+'/services/'+slug+'/';await page.goto(base+route,{waitUntil:'networkidle'});
           const main=await page.locator('main').innerText();
           assert.ok(main.includes(locale==='en'?expected.enTime:expected.arTime));if(locale==='en')assert.ok(main.includes('remain unverified'));
           assert.equal(await page.locator('[data-official-variant-days]').count(),3);const days=await page.locator('[data-official-variant-days]').evaluateAll(es=>es.map(e=>Number(e.getAttribute('data-official-variant-days'))));assert.deepEqual(days,[60,90,120]);
           assert.equal(await page.evaluate(()=>innerWidth),width);assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'No horizontal overflow');
           const documents=locale==='en'?page.locator('#service-documents'):page.locator('main section').filter({has:page.getByRole('heading',{name:/المتطلبات والمستندات|المستندات والمتطلبات/})}).first();
           await documents.scrollIntoViewIfNeeded();await page.screenshot({path:out+'/'+locale+'-'+width+'.png'});
           const gov=page.locator('#service-execution-options .hb-path-official');assert.equal(await gov.getAttribute('href'),route+'#official-variant-options');assert.ok((await page.locator('#service-execution-options .hb-path-assisted').getAttribute('href')).includes('971503780460'));
           assert.deepEqual(errors,[]);report.views.push({width,locale,documents:'UNVERIFIED',processingTime:'2_DAYS_NOT_WORKING_DAYS',eligibility:'UNVERIFIED',fees:'UNVERIFIED',variants:days,status:'PASS'});await page.close();
           }report.status='SCOPED_CONTENT_PUBLICATION_PASS';}catch(e){failure=e;report.status='FAIL';report.error=e.stack;}finally{await browser.close();await writeFile(out+'/report.json',JSON.stringify(report,null,2));}if(failure)throw failure;
          
          NODE
      - name: Allow the existing public catalog cache to expire without redeployment or probes
        run: |
          node --input-type=module <<'NODE'
          const remaining=Date.parse('2026-10-28T14:38:20Z')-Date.now();
          if(remaining>0)await new Promise(r=>setTimeout(r,Math.min(remaining,650000)));
          NODE
      - name: Real conversations without injected history or mocked responses
        env: {HB_BROWSER_PATH: /usr/bin/google-chrome}
        run: |
          node --input-type=module <<'NODE'
          import{chromium}from'playwright';import{mkdir,writeFile}from'node:fs/promises';import assert from'node:assert/strict';
          const out='diagnostics/icp-job-processing-time-live/ai';await mkdir(out,{recursive:true});const report={capturedAt:new Date().toISOString(),source:'LIVE_PRODUCTION_UI_REAL_HISTORY',status:'RUNNING',edgeVersionVerifiedSeparately:170,turns:[],pathways:[],externalModelAcceptance:'NOT_DECLARED',protectedAccountExecution:'NOT_TESTED'};
          const cases=[{"locale":"ar","name":"job","turns":[["أريد تأشيرة لاستكشاف فرص عمل في الشارقة. كم تستغرق المعاملة؟","تأشيرة-استكشاف-فرص-عمل-عبر-icp-خارج-دبي"],["والرسوم؟","تأشيرة-استكشاف-فرص-عمل-عبر-icp-خارج-دبي"]]},{"locale":"en","name":"job","turns":[["I need a job exploration visa in Sharjah. What is the processing time?","تأشيرة-استكشاف-فرص-عمل-عبر-icp-خارج-دبي"],["And the fees?","تأشيرة-استكشاف-فرص-عمل-عبر-icp-خارج-دبي"]]}];
          const browser=await chromium.launch({headless:true,executablePath:process.env.HB_BROWSER_PATH});let failure;
          try{for(const width of[1440,390])for(const c of cases){
           const page=await browser.newPage({viewport:{width,height:width===390?844:960}});page.setDefaultTimeout(30000);await page.goto('https://hossambahr.com'+(c.locale==='en'?'/en':'')+'/ai/',{waitUntil:'networkidle'});
           for(const[question,expected]of c.turns){
            const previous=await page.locator('.hb-chat-message--assistant:not([data-pending])').count(),responsePromise=page.waitForResponse(r=>r.request().method()==='POST'&&r.url().includes('/public-ai-concierge'),{timeout:90000});
            await page.locator('textarea[name=goal]').fill(question);await page.locator('.hb-chat-send').click();const response=await responsePromise;assert.equal(response.status(),200);const request=response.request().postDataJSON(),body=await response.text(),payloads=[];
            try{payloads.push(JSON.parse(body));}catch{for(const line of body.split('\n').filter(s=>s.trim()))try{payloads.push(JSON.parse(line.startsWith('data:')?line.slice(5).trim():line.trim()));}catch{}}
            const terminal=payloads.filter(v=>['done','fallback'].includes(v.type)).at(-1),result=terminal?.result||payloads.at(-1)?.result||payloads.at(-1),actual=result?.matches?.[0]?.service_slug;
            report.turns.push({width,locale:c.locale,question,expected,actual,external_model_used:result?.engine?.external_model_used,provider_failure:result?.engine?.provider_failure?{category:result.engine.provider_failure.category,code:result.engine.provider_failure.code}:null,requestHistoryTurns:Array.isArray(request.history)?request.history.length:0,inheritedServiceId:request.context?.active_service_id||request.context?.service_slug||null,answer:result?.answer?.text||null});
            assert.equal(actual,expected,question);assert.equal(result.answer?.evidence?.policy_version,2,'Reviewed policy is active');
            if(question===c.turns[0][0]){assert.equal(result.answer?.focus,'duration');assert.equal(result.answer?.fact_status,'VERIFIED_FACT');assert.match(result.answer.text,c.locale==='en'?/working days are not specified/:/لم تحدد البطاقات أنهما يوما عمل/);}
            if(question===c.turns[1][0]){assert.equal(result.answer?.focus,'fees');assert.equal(result.answer?.fact_status,'MISSING_INFORMATION');}
            assert.ok(result.matches[0].official_source.url.includes('68e3509b5ae59b00117383ea'),'Processing time cites reviewed job card');assert.equal(result.privacy?.case_created,false);assert.equal(result.privacy?.personal_data_persisted,false);
            await page.waitForFunction(n=>document.querySelectorAll('.hb-chat-message--assistant:not([data-pending])').length>n,previous,{timeout:90000});assert.ok((await page.locator('.hb-chat-message--assistant:not([data-pending])').last().innerText()).trim().length>10);
            const message=page.locator('.hb-chat-message--assistant:not([data-pending])').last();
            if(result.matches[0].official_source?.url)assert.equal(await message.locator('.hb-chat-source-copy a').getAttribute('href'),result.matches[0].official_source.url,'source citation remains a separate reference');
            if(expected.includes('-عبر-icp-خارج-دبي')){
             const official=message.locator('.hb-chat-actions [data-government-duration-selection]');await official.waitFor({state:'visible'});
             const href=(c.locale==='en'?'/en':'')+'/services/'+expected+'/#official-variant-options';assert.equal(await official.getAttribute('href'),href);assert.equal(await official.getAttribute('target'),null);
             report.turns.at(-1).officialAction={href,label:await official.innerText()};
            }
          
           }
           const links=await page.locator('.hb-chat-thread a[href]').evaluateAll(es=>es.map(e=>({label:e.textContent.trim(),href:e.getAttribute('href')})));report.turns.at(-1).visibleLinks=links;
           await page.screenshot({path:out+'/'+c.locale+'-'+c.name+'-'+width+'.png',fullPage:true});
           const official=page.locator('.hb-chat-actions [data-government-duration-selection]').first();await official.click();await page.waitForLoadState('networkidle');
           const expectedIcp=c.name==='business'?'تأشيرة-استكشاف-فرص-عمل-عبر-icp-خارج-دبي':'تأشيرة-استكشاف-فرص-عمل-عبر-icp-خارج-دبي',prefix=c.locale==='en'?'/en':'';
           assert.equal(decodeURI(new URL(page.url()).pathname),prefix+'/services/'+expectedIcp+'/');assert.equal(new URL(page.url()).hash,'#official-variant-options');assert.equal(await page.locator('[data-official-variant-days]').count(),3);
           assert.equal(new URL(await page.locator('[data-official-variant-days="90"]').getAttribute('href')).searchParams.get('serviceid'),c.name==='business'?'68e350315ae59b00117383e7':'68e350ab5ae59b00117383ed');
           report.pathways.push({width,locale:c.locale,kind:c.name,status:'PASS',governmentAction:'CLICKED_TO_LOCALIZED_CANONICAL_DURATION_GATEWAY',officialCards:3,exact90DaySourceVerified:true});
           await page.screenshot({path:out+'/'+c.locale+'-'+c.name+'-government-'+width+'.png',fullPage:true});await page.close();
          }report.status='SCOPED_GROUNDED_COMMON_FACTS_AND_PATH_PASS';report.externalDependency=report.turns.some(t=>t.provider_failure?.category==='QUOTA_BILLING')?'BLOCKED_QUOTA_BILLING':report.turns.every(t=>t.external_model_used===true)?'EXTERNAL_MODEL_OBSERVED_NOT_FULL_QUALITY_ACCEPTANCE':'EXTERNAL_MODEL_NOT_FULLY_VERIFIED';}
          catch(e){report.status='LIVE_FAIL';report.error=String(e);failure=e;}finally{await writeFile(out+'/report.json',JSON.stringify(report,null,2));await browser.close();}if(failure)throw failure;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: icp-job-processing-time-live, path: diagnostics/icp-job-processing-time-live}
      - name: Retain real semantic acceptance evidence
        if: always()
        run: |
          git config user.name "HossamBahr Production Evidence"
          git config user.email "production-evidence@users.noreply.github.com"
          git add diagnostics/icp-job-processing-time-live
          git commit -m "Retain real exploration visa semantic evidence [skip ci]"
          git pull --rebase --autostash origin agent/dld-source-review-evidence
          git push origin HEAD:agent/dld-source-review-evidence
