name: Live localized service sidebar
on:
  push:
    branches: [agent/dld-source-review-evidence]
    paths: ['scripts/live-localized-asides.mjs','.github/workflows/live-localized-asides.yml']
permissions: {contents: write}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: node scripts/wait-localized-asides.mjs
      - run: HB_BROWSER_PATH="$(which chrome)" HB_BASE_URL=https://hossambahr.com HB_OUTPUT_DIR=diagnostics/localized-asides-production-2026-10-19 node scripts/live-localized-asides.mjs
      - if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add diagnostics/localized-asides-production-2026-10-19
          git diff --cached --quiet || git commit -m "Record live localized service sidebar [skip ci]"
          git pull --rebase origin agent/dld-source-review-evidence
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-localized-asides, path: diagnostics/localized-asides-production-2026-10-19}
